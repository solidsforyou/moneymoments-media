<title>GoodHabits Preview</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one phone-sized app centred on a quiet stage; every screen, sheet and overlay lives inside the phone.
   Direction: bright and bold (founder's approved taste), calm spacing. Cobalt = actions and investing, pink = social moments (like, Approve). */
:root{
  --stage:#E8EBF5; --bg:#F6F7FC; --surface:#FFFFFF; --surface-2:#EEF0F8; --line:#DFE3EF; --hair:#EBEEF6;
  --fg:#121633; --soft:#383E62; --muted:#5D6488;
  --accent:#2448FF; --accent-hi:#1534D9; --accent-ink:#FFFFFF; --accent-wash:#E5EAFF;
  --pink:#C8155E; --pink-wash:#FFE6EF; --pink-ink:#FFFFFF;
  --up:#06774A; --down:#C02634; --warn-wash:#FFF3D6; --warn-ink:#7A4E00;
  --shadow:rgba(18,22,51,.14); --scrim:rgba(13,16,36,.48);
  --display:'Bricolage Grotesque', 'Figtree', system-ui, sans-serif;
  --body:'Figtree', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --mono:'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --stage:#05060F; --bg:#0D1024; --surface:#151A33; --surface-2:#1C2242; --line:#2B3259; --hair:#20264A;
  --fg:#F2F4FF; --soft:#C9CEEB; --muted:#A1A8CC;
  --accent:#7F95FF; --accent-hi:#9AABFF; --accent-ink:#0B0E22; --accent-wash:#18205A;
  --pink:#FF5C9E; --pink-wash:#3D1631; --pink-ink:#1A0712;
  --up:#3CD69A; --down:#FF7F89; --warn-wash:#3A2D0E; --warn-ink:#FFD27A;
  --shadow:rgba(0,0,0,.5); --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --stage:#05060F; --bg:#0D1024; --surface:#151A33; --surface-2:#1C2242; --line:#2B3259; --hair:#20264A;
  --fg:#F2F4FF; --soft:#C9CEEB; --muted:#A1A8CC;
  --accent:#7F95FF; --accent-hi:#9AABFF; --accent-ink:#0B0E22; --accent-wash:#18205A;
  --pink:#FF5C9E; --pink-wash:#3D1631; --pink-ink:#1A0712;
  --up:#3CD69A; --down:#FF7F89; --warn-wash:#3A2D0E; --warn-ink:#FFD27A;
  --shadow:rgba(0,0,0,.5); --scrim:rgba(0,0,0,.6); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--stage);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.4;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:12px;
  display:flex;flex-direction:column;align-items:center;gap:10px}
button,input,textarea,select{font-family:inherit;color:inherit;font-size:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-weight:500}

/* stage bar */
.stagebar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;font-size:13px;color:var(--muted);font-weight:600}
.stagebar strong{color:var(--fg)}
.pillbtn{min-height:44px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:0 14px;font-size:13px;font-weight:700;color:var(--soft)}

/* phone */
.phone{position:relative;width:min(400px,100%);height:min(860px, calc(100dvh - 70px));min-height:600px;background:var(--bg);
  border-radius:30px;border:1px solid var(--line);overflow:hidden;display:flex;flex-direction:column;box-shadow:0 30px 70px var(--shadow)}
.screens{position:relative;flex:1;min-height:0}
.screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 8px 6px 16px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.brand .mark{width:28px;height:28px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:16px}
h1{font-family:var(--display);font-weight:800;font-size:28px;letter-spacing:-.02em;line-height:1.08;margin:0;text-wrap:balance}
h2{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:-.01em;margin:0;text-wrap:balance}
h3{font-size:16px;font-weight:800;margin:0}
p{margin:0}
.muted{color:var(--muted)} .soft{color:var(--soft)}
.small{font-size:13px} .tiny{font-size:12px}
.pad{padding:4px 16px 24px;display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:10px}
.spread{display:flex;align-items:center;justify-content:space-between;gap:10px}
.stack{display:flex;flex-direction:column;gap:8px}
.icon-btn{position:relative;width:44px;height:44px;border:0;background:transparent;border-radius:12px;display:grid;place-items:center;color:var(--fg);flex:none}
.icon-btn:active{background:var(--surface-2)}
.icon-btn .dot{position:absolute;top:9px;right:9px;width:9px;height:9px;border-radius:9px;background:var(--pink);border:2px solid var(--bg)}
.btn{min-height:50px;border:0;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:16px;padding:0 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active{background:var(--accent-hi)}
.btn[disabled]{background:var(--surface-2);color:var(--muted);cursor:not-allowed}
.btn.ghost{background:var(--surface-2);color:var(--fg)}
.btn.pink{background:var(--pink);color:var(--pink-ink)}
.btn.sm{min-height:44px;font-size:14px;border-radius:12px;padding:0 14px}
.btn.block{width:100%}
.link{border:0;background:transparent;color:var(--accent);font-weight:800;min-height:44px;padding:0 6px;font-size:14px}
.chip{flex:none;min-height:44px;min-width:48px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:700;color:var(--soft);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 16px 6px}
.chips::-webkit-scrollbar{display:none}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px}
.badge{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:800;background:var(--surface-2);color:var(--soft)}
.badge.house{background:var(--accent-wash);color:var(--accent)}
.badge.news{background:var(--accent-wash);color:var(--accent)}
.badge.gov{background:var(--warn-wash);color:var(--warn-ink)}
.badge.brand{background:var(--pink-wash);color:var(--pink)}
.badge.sci{background:var(--surface-2);color:var(--up)}
.avatar{width:40px;height:40px;border-radius:999px;flex:none;display:grid;place-items:center;font-weight:800;font-size:14px;color:#fff}
.avatar.lg{width:84px;height:84px;font-size:30px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:700;color:var(--soft)}
.input{min-height:50px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);padding:0 14px;font-size:16px;width:100%}
.input:focus{border-color:var(--accent);outline:none}
textarea.input{padding:12px 14px;min-height:90px;resize:none;line-height:1.45}
.help{font-size:13px;color:var(--muted);line-height:1.45}
.err{font-size:13px;color:var(--down);font-weight:700}
.note{font-size:12px;color:var(--muted);line-height:1.5}
.divider{height:1px;background:var(--hair);margin:4px 0}

/* tab bar */
.tabbar{flex:none;height:66px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--surface);border-top:1px solid var(--line)}
.tabbar button{border:0;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:700}
.tabbar button[aria-current="page"]{color:var(--fg)}
.tabbar button[aria-current="page"] svg{color:var(--accent)}

/* stories */
.stories{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;padding:4px 16px 10px}
.stories::-webkit-scrollbar{display:none}
.story{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:5px;width:70px;flex:none;font-size:12px;font-weight:600;color:var(--soft)}
.story .ring{width:64px;height:64px;border-radius:999px;padding:3px;background:conic-gradient(var(--pink),var(--accent),var(--pink))}
.story .ring.seen{background:var(--line)}
.story .ring .avatar{width:100%;height:100%;border:3px solid var(--bg);font-size:18px}
.story .name{max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* posts */
.post{background:var(--surface);border-top:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column}
.post + .post{margin-top:10px}
.post-head{display:flex;align-items:center;gap:10px;padding:10px 6px 10px 14px}
.post-head .who{flex:1;min-width:0}
.post-head .name{font-weight:800;font-size:15px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.post-head .meta{font-size:12px;color:var(--muted);font-weight:600}
.post-text{padding:0 14px 12px;font-size:15px;line-height:1.5;color:var(--fg)}
.media{position:relative;aspect-ratio:4/5;max-width:100%;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:22px;gap:10px;color:#fff}
.media.wide{aspect-ratio:16/11}
.media .kicker{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;opacity:.9}
.media .big{font-family:var(--display);font-weight:800;font-size:32px;line-height:1.02;letter-spacing:-.02em;text-wrap:balance;max-width:320px}
.media .play{position:absolute;top:14px;right:14px;height:28px;padding:0 10px;border-radius:999px;background:rgba(0,0,0,.45);font-size:12px;font-weight:800;display:flex;align-items:center;gap:6px}
.media svg.chart{position:absolute;left:0;right:0;top:18%;width:100%;height:42%;opacity:.95}
.actions{display:flex;align-items:center;gap:2px;padding:4px 6px}
.actions .grow{flex:1}
.act{min-height:44px;min-width:44px;border:0;background:transparent;border-radius:12px;display:inline-flex;align-items:center;gap:6px;padding:0 8px;font-weight:800;font-size:14px;color:var(--fg)}
.act[aria-pressed="true"].like{color:var(--pink)}
.act.approve{color:var(--pink)}
.act.approve[aria-pressed="true"]{background:var(--pink);color:var(--pink-ink)}
.post-foot{padding:0 14px 12px;font-size:14px;line-height:1.45}
.post-foot .approvedby{font-size:13px;color:var(--muted);font-weight:700;margin-bottom:4px;display:flex;gap:6px;align-items:center}
.flexcard{margin:0 14px 12px;border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;background:var(--surface-2)}
.flexcard .proud{font-size:12px;font-weight:800;color:var(--accent);letter-spacing:.06em;text-transform:uppercase}

/* reminder */
.top{flex-wrap:wrap}
.top > :first-child{flex:1 1 0;min-width:0}
.top > :not(:first-child):not(.nudge-row){flex:none}
.brand{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nudge-row{flex-basis:100%;display:flex;justify-content:flex-end;padding:2px 2px 4px}
.nudge{display:flex;align-items:center;gap:6px;padding:6px 6px 6px 12px;border-radius:999px;background:var(--fg);color:var(--bg);box-shadow:0 10px 26px var(--shadow);font-size:13px;font-weight:800;animation:pop .25s ease-out}
.nudge button{border:0;background:transparent;color:inherit;font-weight:800;min-height:36px;padding:0 8px;border-radius:999px}
.nudge .go{background:var(--accent);color:var(--accent-ink)}
@keyframes pop{from{transform:translateY(-6px) scale(.96);opacity:0}to{transform:none;opacity:1}}

/* overlays */
.scrim{position:absolute;inset:0;background:var(--scrim);z-index:30;display:flex;flex-direction:column;justify-content:flex-end}
.sheet{background:var(--surface);border-radius:24px 24px 0 0;padding:8px 16px 20px;display:flex;flex-direction:column;gap:14px;max-height:90%;overflow-y:auto;animation:up .22s ease-out}
.sheet .grab{align-self:center;width:40px;height:4px;border-radius:4px;background:var(--line);flex:none}
@keyframes up{from{transform:translateY(26px);opacity:.5}to{transform:none;opacity:1}}
.full{position:absolute;inset:0;z-index:25;background:var(--bg);display:flex;flex-direction:column;animation:fade .18s ease-out}
.full .body{flex:1;overflow-y:auto;min-height:0}
@keyframes fade{from{opacity:0}to{opacity:1}}
.toast{position:absolute;left:14px;right:14px;bottom:80px;z-index:50;background:var(--fg);color:var(--bg);border-radius:14px;padding:12px 14px;font-size:14px;font-weight:700;box-shadow:0 14px 30px var(--shadow);animation:up .2s ease-out}

/* onboarding */
.onb{position:absolute;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column}
.onb .body{flex:1;overflow-y:auto;padding:20px 20px 10px;display:flex;flex-direction:column;gap:16px}
.onb .foot{padding:12px 20px 20px;display:flex;flex-direction:column;gap:8px}
.dots{display:flex;gap:6px}
.dots i{width:7px;height:7px;border-radius:7px;background:var(--line)}
.dots i.on{width:22px;background:var(--accent)}
.hero-art{border-radius:24px;aspect-ratio:1/1;max-width:100%;position:relative;overflow:hidden;display:flex;align-items:flex-end;padding:20px;color:#fff}
.tourcard{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.tourcard .ico{width:40px;height:40px;border-radius:12px;background:var(--accent-wash);color:var(--accent);display:grid;place-items:center;flex:none}
.amounts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.amt{min-height:50px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:800;font-size:15px}
.amt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-wash);color:var(--accent)}
.opt{width:100%;min-height:56px;display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);text-align:left;font-weight:700}
.opt[aria-checked="true"]{border-color:var(--accent);background:var(--accent-wash)}
.opt .radio{width:20px;height:20px;border-radius:20px;border:2px solid var(--muted);flex:none}
.opt[aria-checked="true"] .radio{border:6px solid var(--accent)}
.switch{position:relative;width:52px;height:32px;border-radius:32px;border:0;background:var(--line);flex:none}
.switch::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:24px;background:var(--surface);transition:transform .15s}
.switch[aria-checked="true"]{background:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}

/* news */
.search{display:flex;gap:8px;align-items:center;padding:0 6px 0 14px;min-height:54px;border-radius:16px;border:1.5px solid var(--line);background:var(--surface)}
.search:focus-within{border-color:var(--accent)}
.search input{flex:1;min-width:0;border:0;background:transparent;font-size:16px;outline:none;min-height:50px}
.result{display:flex;flex-direction:column;gap:6px;padding:14px 0;border-bottom:1px solid var(--hair)}
.result button.title{border:0;background:transparent;text-align:left;padding:0;font-size:16px;font-weight:800;line-height:1.3;color:var(--fg)}
.stars{display:inline-flex;gap:1px;color:#F5A524}
.stars .off{color:var(--line)}
.rate{display:flex;gap:6px}
.rate button{width:48px;height:48px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-size:22px;color:var(--line)}
.rate button.on{color:#F5A524;border-color:#F5A524}
.skeleton{height:14px;border-radius:8px;background:var(--surface-2);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.5}}
.reader p{font-size:17px;line-height:1.65;color:var(--fg);max-width:65ch}

/* money */
.swap{border-radius:22px;padding:18px;background:var(--accent);color:var(--accent-ink);display:flex;flex-direction:column;gap:12px}
.swap .from{display:flex;align-items:center;gap:10px;font-weight:700}
.swap .strike{text-decoration:line-through;opacity:.85}
.swap .btn{background:var(--accent-ink);color:var(--accent)}
.stock{width:100%;min-height:64px;display:flex;align-items:center;gap:12px;border:0;background:transparent;text-align:left;padding:8px 0;border-bottom:1px solid var(--hair)}
.stock .tick{width:44px;height:44px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--soft);flex:none}
.up{color:var(--up)} .down{color:var(--down)}
.statgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{padding:12px 14px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.stat .v{font-family:var(--display);font-weight:800;font-size:22px}
.disclaimer{font-size:12px;color:var(--muted);line-height:1.5;padding:10px 12px;border-radius:12px;background:var(--surface-2)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);padding:4px;border-radius:12px;background:var(--surface-2)}
.seg button{min-height:44px;border:0;border-radius:9px;background:transparent;color:var(--muted);font-weight:800;font-size:14px}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 4px var(--shadow)}

/* profile */
.ptabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);padding:0 10px;position:sticky;top:0;background:var(--bg);z-index:3}
.ptabs::-webkit-scrollbar{display:none}
.ptabs button{min-height:46px;border:0;background:transparent;color:var(--muted);font-weight:800;font-size:14px;padding:0 10px;border-bottom:3px solid transparent;white-space:nowrap}
.ptabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:10px}
.tile{aspect-ratio:4/5;max-width:100%;display:flex;align-items:flex-end;padding:8px;font-size:12px;font-weight:800;color:#fff;line-height:1.25;border:0;text-align:left}
.apptile{border-radius:16px;overflow:hidden;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;text-align:left;padding:0}
.apptile .tile{aspect-ratio:1/1;font-size:13px;padding:10px}
.apptile .cm{padding:8px 10px 10px;font-size:12.5px;line-height:1.4;color:var(--soft)}
.apptile .cm b{color:var(--pink)}
.habit{display:grid;grid-template-rows:repeat(7,10px);grid-auto-flow:column;grid-auto-columns:10px;gap:3px;overflow:hidden}
.habit i{border-radius:3px;background:var(--surface-2)}
.habit i.l1{background:color-mix(in srgb, var(--up) 30%, var(--surface-2))}
.habit i.l2{background:color-mix(in srgb, var(--up) 60%, var(--surface-2))}
.habit i.l3{background:var(--up)}
.legend{display:flex;gap:4px;align-items:center;font-size:12px;color:var(--muted)}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* hissab */
.bal{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.bal .stat .v.owe{color:var(--down)} .bal .stat .v.owed{color:var(--up)}
.person{width:100%;min-height:64px;display:flex;align-items:center;gap:12px;border:0;background:transparent;text-align:left;padding:8px 0;border-bottom:1px solid var(--hair)}
.who-pick{display:flex;flex-wrap:wrap;gap:8px}

/* dms */
.msg{max-width:80%;padding:10px 12px;border-radius:16px;font-size:15px;line-height:1.45}
.msg.them{background:var(--surface);border:1px solid var(--line);align-self:flex-start}
.msg.me{background:var(--accent);color:var(--accent-ink);align-self:flex-end;font-weight:600}
.flag{display:flex;gap:8px;align-items:flex-start;padding:10px 12px;border-radius:12px;background:var(--warn-wash);color:var(--warn-ink);font-size:13px;font-weight:700;line-height:1.45;max-width:90%}

/* reel viewer + story viewer */
.viewer{position:absolute;inset:0;z-index:35;display:flex;flex-direction:column;justify-content:flex-end;color:#fff;padding:16px;gap:12px}
.viewer .bars{position:absolute;top:10px;left:12px;right:12px;display:flex;gap:4px}

// "₹1,200.50" -> 120050 paise; anything else -> NaN
function parsePaise(str){
  const t = String(str).replace(/[\s,₹]/g, '');
  const m = /^(\d{1,9})(?:\.(\d{1,2}))?$/.exec(t);
  return m ? +m[1] * 100 + +((m[2] || '0') + '0').slice(0, 2) : NaN;
}

const layer = () => $('#layer');
function sheet(html, label){ layer().innerHTML = `<div class="scrim"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(label)}" data-stop><div class="grab"></div>${html}</div></div>`; focusFirst(); }
function full(html, label){ layer().innerHTML = `<div class="full" role="dialog" aria-modal="true" aria-label="${esc(label)}">${html}</div>`; focusFirst(); }
function closeLayer(){ layer().innerHTML = ''; stopTimers(); }
function focusFirst(){ requestAnimationFrame(() => { const el = layer().querySelector('input,textarea,button'); el && el.focus({preventScroll:true}); }); }

function postHTML(p){

  let media = '';
  if (p.kind === 'reel' || p.kind === 'post') {
    const chart = p.chart ? `<svg class="chart" viewBox="0 0 300 120" preserveAspectRatio="none" aria-hidden="true"><path d="M0 105 L40 98 L80 92 L120 80 L160 70 L200 52 L240 38 L300 12" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/><path d="M0 105 L40 98 L80 92 L120 80 L160 70 L200 52 L240 38 L300 12 L300 120 L0 120Z" fill="rgba(255,255,255,.16)"/></svg>` : '';
    media = `<button class="media ${p.kind==='post'?'wide':''}" data-act="${p.kind==='reel'?'reel':'none'}" data-id="${p.id}" style="background:${GRADS[p.grad]};border:0;text-align:left;cursor:${p.kind==='reel'?'pointer':'default'}" aria-label="${p.kind==='reel'?'Play reel: ':''}${esc(p.big)}">

  }
  const flex = p.flex ? `<div class="flexcard"><span class="proud">Flex · ${esc(p.flex.proud)}</span><h3>${esc(p.flex.title)}</h3><p class="small soft">${esc(p.flex.detail)}</p></div>` : '';

    <div class="post-head"><button class="icon-btn" style="width:44px;height:44px" data-act="open-profile" data-who="${p.who}" aria-label="Open ${esc(who.name)}'s profile">${av(p.who)}</button>
      <div class="who"><div class="name">${esc(who.name)} ${badge}</div><div class="meta"><span class="mono">${esc(who.id)}</span> · ${p.time} · ${esc(p.topic)}</div></div></div>
    ${p.kind==='flex' || p.kind==='post' ? `<p class="post-text">${esc(p.text)}</p>` : ''}

    <div class="actions">

}

function onFeedScroll(e){
  const el = e.target;
  if (!state.reminders.on || state.nudgeShown || Date.now() < state.snoozeUntil) return;
  state.scrolled = Math.max(state.scrolled, Math.floor(el.scrollTop / 380));
  // In the app: every 15 scrolls or 10 minutes, as the user set it. Here after 3 posts so the preview shows it.
  if (state.scrolled >= 3) { state.scrolled = 0; showNudge(); }
}
function showNudge(){
  state.nudgeShown = true;
  // A row inside the sticky header, top right: it never covers what the user is reading or tapping.
  const top = document.querySelector(`#s-${state.tab} .top`); if (!top) return;
  top.querySelector('.nudge-row')?.remove();
  top.insertAdjacentHTML('beforeend', `<div class="nudge-row"><div class="nudge" role="status">Up for some investing?<button class="go" data-act="nudge-go">Yes</button><button data-act="nudge-x" aria-label="Not now">${ico('close',16)}</button></div></div>`);
}

      const s = srcScore(a.src);
      return `<div class="result"><button class="title" data-act="article" data-i="${i}">${esc(a.title)}</button>
        <div class="row small" style="flex-wrap:wrap;gap:8px"><span class="soft" style="font-weight:700">${esc(a.src)}</span><span class="badge ${typeClass(s.type)}">${s.type}</span><span class="muted">${a.age} ago</span></div>
        <div class="spread small"><span class="row" style="gap:6px">${starsHTML(s.avg)}<span class="num" style="font-weight:800">${s.avg.toFixed(1)}</span><span class="muted num">(${s.n.toLocaleString('en-IN')} trust ratings)</span></span>
        <button class="link" data-act="rate" data-src="${esc(a.src)}">${state.ratings[a.src]?'Rated':'Rate source'}</button></div></div>`; }).join('')
      : `<p class="muted">No credible articles for "${esc(n.q)}" in our index yet. Try fewer words.</p>`;

function balances(){
  const bal = {}; // positive: they owe you; negative: you owe them (paise)
  for (const e of H.expenses){
    const share = Math.floor(e.amt / e.split.length), rem = e.amt - share * e.split.length;
    e.split.forEach((p, i) => {
      const owed = share + (i < rem ? 1 : 0);
      if (p === e.paid) return;
      if (e.paid === 'me') bal[p] = (bal[p] || 0) + owed;
      else if (p === 'me') bal[e.paid] = (bal[e.paid] || 0) - owed;
    });
  }
  for (const pay of H.payments) bal[pay.k] = (bal[pay.k] || 0) - pay.amt;
  return bal;
}

      <div class="stack" ${state.reminders.on?'':'hidden'}>${['15 scrolls','10 minutes','Once a day'].map(x=>`<button class="opt" role="radio" data-act="rem-every" data-v="${x}" aria-checked="${state.reminders.every===x}"><span class="radio"></span>${remLabel(x)}</button>`).join('')}<p class="help">Never late at night, and never right after a loss.</p></div>${dots(4)}</div>${foot('Start scrolling, the good way','onb-done')}`;
  layer().innerHTML = `<div class="onb" role="dialog" aria-modal="true" aria-label="Sign up">${html}</div>`;
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const scrim = e.target.closest('.scrim');
  if (scrim && !e.target.closest('[data-stop]')) { closeLayer(); return; }
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, id = b.dataset.id;
  const post = id && state.posts.find(p => p.id === id);
  switch (a) {
    case 'tab': go(b.dataset.tab); break;
    case 'close': case 'close-sheet': closeLayer(); break;
    case 'filter': state.filter = b.dataset.f; render.feed(); break;
    case 'like': state.liked.has(id) ? state.liked.delete(id) : state.liked.add(id); render.feed(); break;
    case 'approve': {
      if (state.approved.some(x => x.pid === id)) { state.approved = state.approved.filter(x => x.pid !== id); render.feed(); toast('Removed from your Approved tab'); break; }
      sheet(`<h2>Approve this?</h2><p class="soft">It goes to your followers' feeds as "Approved by you" and onto your Approved tab, with your note.</p>
        <div class="field"><label for="ap-note">Your note (optional)</label><textarea class="input" id="ap-note" placeholder="Good advice: why it helped you"></textarea></div>
        <button class="btn pink block" data-act="approve-save" data-id="${id}">${ico('approve',20)} Approve</button>`, 'Approve');
      break; }
    case 'approve-save': {
      const p = state.posts.find(x => x.id === id), note = $('#ap-note').value.trim();
      state.approved.unshift({pid:id, note, big:p.big || (p.flex && p.flex.title) || p.text, grad:p.grad ?? 3});
      closeLayer(); render.feed(); toast('Approved. It\'s on your profile now.'); break; }
    case 'comments': {
      const cs = [['meera','This is the clearest explanation I\'ve seen.'],['rohan','Saving this for salary day.'],['zoya','Can you do one on index funds next?']];
      sheet(`<h2>Comments</h2><div class="stack" id="clist">${cs.map(([k,t])=>`<div class="row" style="align-items:flex-start">${av(k)}<p class="small" style="line-height:1.5"><b>${esc(people[k].name)}</b> ${esc(t)}</p></div>`).join('')}</div>
        <form class="row" id="cform"><label for="c-in" style="position:absolute;left:-9999px">Add a comment</label><input class="input" id="c-in" placeholder="Add a comment" style="flex:1"><button class="btn sm" type="submit">Post</button></form>`, 'Comments');
      break; }
    case 'share': toast('Link copied. Opens in GoodHabits, or on the web without an account.'); break;
    case 'reel': openReel(post); break;
    case 'story': openStory(b.dataset.who); break;
    case 'open-profile': toast(`${people[b.dataset.who].name} · ${people[b.dataset.who].id}`); break;
    case 'create': sheet(`<h2>Create</h2><div class="stack">${[['Post','Photo and text, like LinkedIn'],['Reel','Short video, like Instagram'],['Flex','Something you\'re proud of'],['Story','Gone in 24 hours']].map(([t,d])=>`<button class="opt" data-act="create-pick" data-t="${t}"><span class="ico" style="width:36px;height:36px;border-radius:10px;background:var(--accent-wash);color:var(--accent);display:grid;place-items:center">${ico('plus',18)}</span><span><b style="display:block">${t}</b><span class="small muted">${d}</span></span></button>`).join('')}</div><p class="note">No promotions, offers or "buy now". Brands can share their journey and work.</p>`, 'Create'); break;
    case 'create-pick': closeLayer(); toast(`The ${b.dataset.t.toLowerCase()} composer comes in the full build.`); break;
    case 'activity': full(header('Recent activity') + `<div class="body"><div class="pad">${[['ananya','liked your post "3 tools I use for budgeting"','2m'],['kabir','Approved your reel "Budget in 60 seconds"','1h'],['meera','started following you','3h'],['zoya','added "Groceries" in Flat 302 · Hissab','5h'],['rohan','commented: "Saving this for salary day."','1d']].map(([k,t,w])=>`<div class="row" style="align-items:flex-start">${av(k)}<p class="small" style="line-height:1.5;flex:1"><b>${esc(people[k].name)}</b> ${esc(t)} <span class="muted">${w}</span></p></div>`).join('')}</div></div>`, 'Recent activity'); break;
    case 'dms': openDMs(); break;
    case 'chat': openChat(); break;
    // In the app the snooze is the user's own interval; 30 seconds here so the preview shows it coming back.
    case 'nudge-x': document.querySelectorAll('.nudge-row').forEach(n => n.remove()); state.nudgeShown = false; state.snoozeUntil = Date.now() + 30000; toast('Okay. We\'ll ask again later, on your schedule.'); break;
    case 'nudge-go': document.querySelectorAll('.nudge-row').forEach(n => n.remove()); go('money'); stockSheet('NIFTYBEES', 100000); break;
    case 'suggest': $('#news-q') && ($('#news-q').value = b.dataset.q); runSearch(b.dataset.q); break;
    case 'article': openArticle(state.news.results[+b.dataset.i]); break;
    case 'rate': rateSheet(b.dataset.src); break;
    case 'review': { const t = b.dataset.title, r0 = state.reviews[t] || {v:'', text:''};
      sheet(`<h2>Review this article</h2><p class="small muted">${esc(t)}</p><div class="field"><label>Was it accurate and fair?</label><div class="who-pick" role="radiogroup">${['Yes','Partly','No'].map(v=>`<button class="chip" role="radio" data-act="rv-pick" data-v="${v}" aria-checked="${r0.v===v}" aria-pressed="${r0.v===v}">${v}</button>`).join('')}</div></div>
        <div class="field"><label for="arv">What should other readers know? (optional)</label><textarea class="input" id="arv" placeholder="A missing fact, a good source, a fair point">${esc(r0.text)}</textarea></div>
        <p class="note">Reviews are public after a quick check. Be fair to the writer.</p><button class="btn block" data-act="review-save" data-title="${esc(t)}">Post review</button>`, 'Review article'); break; }
    case 'rv-pick': b.parentElement.querySelectorAll('[data-act=rv-pick]').forEach(x => { const on = x === b; x.setAttribute('aria-checked', on); x.setAttribute('aria-pressed', on); }); break;
    case 'review-save': { const sel = layer().querySelector('[data-act=rv-pick][aria-pressed=true]'); if (!sel) { toast('Pick Yes, Partly or No first.'); break; } state.reviews[b.dataset.title] = {v:sel.dataset.v, text:$('#arv').value.trim()}; closeLayer(); toast('Thanks. Your review goes public after a quick check.'); break; }
    case 'star': { const src = b.dataset.src, v = +b.dataset.v; rateState.stars = v; drawRate(src); break; }
    case 'rate-save': { state.ratings[b.dataset.src] = {stars:rateState.stars, review:$('#rv').value.trim()}; closeLayer(); render.news(); toast('Thanks. Your rating is public and counts now.'); break; }
    case 'mtab': state.moneyTab = b.dataset.t; render.money(); break;
    case 'stock': stockSheet(b.dataset.sym); break;
    case 'amt': stockSheetState.set(+b.dataset.a); break;
    case 'connect': sheet(`<h2>Connect Zerodha</h2><p class="soft" style="line-height:1.55">You'll log in on Kite, Zerodha's own page. We never see your password. Zerodha asks you to log in again each morning; that's their safety rule, not ours.</p>
        <div class="card" style="padding:12px 14px" ><p class="small soft">No Zerodha account? Open one with Zerodha first, then come back.</p></div>
        <button class="btn block" data-act="connect-ok">Log in with Kite</button><p class="note">Preview: this pretends to connect. Nothing is linked.</p>`, 'Connect Zerodha'); break;
    case 'connect-ok': state.zerodha = true; closeLayer(); render.money(); toast('Zerodha connected (preview)'); break;
    case 'buy': { const c = stockSheetState.get(); closeLayer(); toast(`Order sent to Zerodha for ${c.qty} share${c.qty===1?'':'s'} (preview, nothing was bought)`); break; }
    case 'swap': go('money'); stockSheet('NIFTYBEES', 649900); break;
    case 'coin': toast('Opens Zerodha Coin (preview)'); break;
    case 'ptab': state.profileTab = b.dataset.t; render.profile(); break;
    case 'add-flex': sheet(`<h2>Add a Flex</h2><div class="field"><label for="fx-t">What are you proud of?</label><input class="input" id="fx-t" placeholder="Shipped, built, helped, solved…"></div><div class="field"><label for="fx-d">Tell the story</label><textarea class="input" id="fx-d" placeholder="What you did and what changed because of it"></textarea></div><p class="note">No job titles needed. We take your word for it, so keep it true.</p><button class="btn block" data-act="flex-save">Add Flex</button>`, 'Add a Flex'); break;
    case 'flex-save': { const t = $('#fx-t').value.trim(); if (!t) { toast('Give your Flex a title first.'); break; } FLEXES.unshift({proud:'New', title:t, detail:$('#fx-d').value.trim() || 'Added just now.'}); closeLayer(); render.profile(); toast('Flex added'); break; }
    case 'edit-profile': case 'share-profile': toast(a === 'edit-profile' ? 'Profile editing comes in the full build.' : 'Profile link copied'); break;
    case 'settings': openSettings(); break;
    case 'rem-toggle': state.reminders.on = !state.reminders.on; state.nudgeShown = false; state.scrolled = 0; layer().querySelector('.onb') ? onboarding() : openSettings(); break;
    case 'rem-every': state.reminders.every = b.dataset.v; layer().querySelector('.onb') ? onboarding() : openSettings(); break;
    case 'add-exp': expenseSheet(); break;
    case 'ex-paid': { const d = $('#ex-what').value, m = $('#ex-amt').value; expState.paid = b.dataset.k; expState.draw(d, m); break; }
    case 'ex-split': { const d = $('#ex-what').value, m = $('#ex-amt').value, k = b.dataset.k; expState.sel.has(k) ? expState.sel.delete(k) : expState.sel.add(k); expState.draw(d, m); break; }
    case 'ex-group': { const d = $('#ex-what').value, m = $('#ex-amt').value, g = H.groups.find(x => x.id === b.dataset.g); expState.group = b.dataset.g; if (g) { expState.sel.clear(); g.members.forEach(k => expState.sel.add(k)); } expState.draw(d, m); break; }
    case 'ex-justme': { const d = $('#ex-what').value, m = $('#ex-amt').value; expState.group = ''; expState.paid = 'me'; expState.sel.clear(); expState.sel.add('me'); expState.draw(d, m); break; }
    case 'ex-save': { const what = $('#ex-what').value.trim() || 'Expense', amt = parsePaise($('#ex-amt').value); if (!(amt > 0) || !expState.sel.size) break; H.expenses.push({id:'e'+Date.now(), g:expState.group || null, what, paid:expState.paid, amt, split:[...expState.sel]}); closeLayer(); render.hissab(); toast('Expense added'); break; }
    case 'add-friend': sheet(`<h2>Add a friend</h2><div class="field"><label for="fr-name">Name</label><input class="input" id="fr-name" placeholder="Arjun Mehta"></div><div class="field"><label for="fr-id">Good ID or phone number</label><input class="input" id="fr-id" placeholder="good/arjun or 98xxxxxx10" autocapitalize="off"><p class="help">Not on GoodHabits yet? Add their phone number; we'll keep the hissab until they join.</p></div><p class="err" id="fr-err" hidden>Add a name and a Good ID or phone number.</p><button class="btn block" data-act="friend-save">Add friend</button>`, 'Add a friend'); break;
    case 'friend-save': { const nm = $('#fr-name').value.trim(), raw = $('#fr-id').value.trim(); if (!nm || !raw) { $('#fr-err').hidden = false; break; } const k = 'f' + Date.now(), phone = /^[+\d][\d\s-]{6,}$/.test(raw); people[k] = {name:nm, id: phone ? raw : (raw.startsWith('good/') ? raw : 'good/' + raw).toLowerCase(), bg:'#4A3F8F'}; H.friends[k] = nm; closeLayer(); render.hissab(); toast(`${nm.split(' ')[0]} added`); break; }
    case 'friend': friendSheet(b.dataset.k); break;
    case 'settle': { const k = b.dataset.k, v = balances()[k] || 0; if (v) H.payments.push({k, amt:v}); closeLayer(); render.hissab(); toast('Marked as settled'); break; }
    case 'monthly': state.user.monthly = b.dataset.v; onboarding(); break;
    case 'topic': { const t = b.dataset.t; const gid = $('#u-gid').value; state.user.goodId = 'good/' + gid; state.user.topics.has(t) ? state.user.topics.delete(t) : state.user.topics.add(t); onboarding(); break; }
    case 'onb-next': onbStep++; onboarding(); break;
    case 'onb-signup': { const n = $('#u-name').value.trim(), c = $('#u-contact').value.trim(); state.user.name = n; state.user.contact = c; if (!n || !c) { onboarding(); $('#onb-err').hidden = false; break; } onbStep++; onboarding(); break; }
    case 'onb-gid': { const v = ($('#u-gid').value || '').toLowerCase().replace(/[^a-z0-9.]/g,''); if (!v) { toast('Pick a Good ID with letters or numbers.'); break; } state.user.goodId = 'good/' + v; onbStep++; onboarding(); break; }
    case 'onb-done': closeLayer(); go('feed'); toast(`Welcome, ${state.user.name.split(' ')[0] || 'friend'}. Your feed is ad-free.`); break;
  }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'news-form') runSearch($('#news-q').value);
  if (e.target.id === 'cform') { const v = $('#c-in').value.trim(); if (!v) return; $('#clist').insertAdjacentHTML('beforeend', `<div class="row" style="align-items:flex-start">${av('me')}<p class="small" style="line-height:1.5"><b>You</b> ${esc(v)}</p></div>`); $('#c-in').value = ''; }
  if (e.target.id === 'dm-form') { const v = $('#dm-in').value.trim(); if (!v) return; $('#thread').insertAdjacentHTML('beforeend', `<div class="msg me">${esc(v)}</div>`); $('#dm-in').value = ''; }
});
document.addEventListener('input', e => {
  // keep typed values when a tap redraws the step
  const t = e.target;
  if (t.id === 'u-name') state.user.name = t.value;
  if (t.id === 'u-contact') state.user.contact = t.value;
  if (t.id === 'u-gid') state.user.goodId = 'good/' + t.value;
  if (t.id === 'ex-amt' && expState) expState.refresh();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && layer().innerHTML && !layer().querySelector('.onb')) closeLayer(); });
$('#s-feed').addEventListener('scroll', onFeedScroll, {passive:true});
$('#s-news').addEventListener('scroll', e => { if (state.reminders.on && !state.nudgeShown && Date.now() >= state.snoozeUntil && e.target.scrollTop > 600) showNudge(); }, {passive:true});

/* ---------- overlays: reel, story, dms, article, rating, settings, friend ---------- */
function openReel(p){
  layer().innerHTML = `<div class="viewer" role="dialog" aria-modal="true" aria-label="Reel" style="background:${GRADS[p.grad]}">
    <div class="bars"><i><b id="rb"></b></i></div><button class="icon-btn close" data-act="close" aria-label="Close">${ico('close',26)}</button>
    <span style="font-weight:800;letter-spacing:.1em;text-transform:uppercase;font-size:12px">${esc(p.kicker)}</span><span class="big">${esc(p.big)}</span>
    <p style="max-width:320px;line-height:1.5">${esc(p.text)}</p><div class="row">${av(p.who)}<b>${esc(people[p.who].name)}</b>${people[p.who].house?'<span class="badge house">House account · AI voice</span>':''}</div></div>`;
  const bar = $('#rb'); bar.style.transition = 'width 6s linear'; requestAnimationFrame(() => bar.style.width = '100%');
}
function openStory(k){
  const p = people[k];
  layer().innerHTML = `<div class="viewer" role="dialog" aria-modal="true" aria-label="Story" style="background:${GRADS[Object.keys(people).indexOf(k) % 6]}">
    <div class="bars"><i><b id="sb"></b></i></div><button class="icon-btn close" data-act="close" aria-label="Close">${ico('close',26)}</button>
    <div class="row" style="position:absolute;top:24px;left:14px;right:64px;flex-wrap:wrap">${av(k)}<b>${esc(p.name)}</b>${p.house?'<span class="badge house">House account · AI voice</span>':''}</div>
    <span class="big">${k==='studio'?'Today\'s habit: 10 minutes of reading before your phone':'Day 47 of investing before spending'}</span></div>`;
  const bar = $('#sb'); bar.style.transition = 'width 5s linear'; requestAnimationFrame(() => bar.style.width = '100%');
  timers.push(setTimeout(closeLayer, 5200));
}
function openDMs(){
  full(header('Messages') + `<div class="body"><div class="pad">${[['ananya','Sending the invoice repo link now','2m',true],['kabir','Goa photos are up!','1h',false],['stranger','Hi, I am from GoodHabits support…','3h',true]].map(([k,t,w,u])=>`<button class="person" data-act="${k==='stranger'?'chat':'none'}">${av(k)}<span style="flex:1;min-width:0"><span style="display:block;font-weight:800">${esc(people[k].name)}</span><span class="small ${u?'':'muted'}" style="${u?'font-weight:700':''}">${esc(t)}</span></span><span class="small muted">${w}</span></button>`).join('')}<p class="note">DMs are back where they were. Messages from people you don't follow land in Requests; tap Help Desk 24x7 to see how we flag scams.</p></div></div>`, 'Messages');
}
function openChat(){
  full(header(esc(people.stranger.name)) + `<div class="body"><div class="pad" id="thread" style="gap:10px">
    <p class="small muted">Message request · you don't follow this account · joined 2 days ago</p>
    <div class="msg them">Hi, I am from GoodHabits support. Your Zerodha link will be blocked today.</div>
    <div class="msg them">Share the OTP you received to keep it active.</div>
    <div class="flag" role="note">${ico('shield',18)}<span>This looks like a scam. GoodHabits and Zerodha never ask for codes or passwords in DMs. Don't share it.</span></div>
    <div class="row"><button class="btn ghost sm" data-act="close">Block and report</button></div></div></div>
    <form class="row" id="dm-form" style="padding:10px 12px;border-top:1px solid var(--line)"><label for="dm-in" style="position:absolute;left:-9999px">Message</label><input class="input" id="dm-in" placeholder="Message" style="flex:1"><button class="btn sm" type="submit">Send</button></form>`, 'Chat');
}
function openArticle(a){
  const s = srcScore(a.src);
  full(header('Reading', `<button class="link" data-act="rate" data-src="${esc(a.src)}">Rate source</button>`) + `<div class="body"><div class="pad reader">
    <div class="row small" style="flex-wrap:wrap;gap:8px"><b>${esc(a.src)}</b><span class="badge ${typeClass(s.type)}">${s.type}</span><span class="muted">${a.age} ago</span></div>
    <h1 style="font-size:28px">${esc(a.title)}</h1>
    <div class="row small">${starsHTML(s.avg)}<b class="num">${s.avg.toFixed(1)}</b><span class="muted num">reader trust · ${s.n.toLocaleString('en-IN')} ratings</span></div>
    <p>Sample article text for the preview. In the app, the article opens in a clean reader with no ads, or at the source's own page with a short summary in our words.</p>
    <p>Every result comes from our index of approved sources, so you see where it's from and how readers rate that source before you trust it.</p>
    <div class="card" style="padding:12px 14px"><h3>Review this article</h3><p class="small muted" style="margin-top:4px">Was it accurate and fair? Reviews are public and moderated.</p><button class="btn ghost sm" style="margin-top:10px" data-act="review" data-title="${esc(a.title)}">${state.reviews[a.title] ? 'Edit your review' : 'Write a review'}</button></div>
  </div></div>`, 'Article');
}
let rateState = {stars:0};
function rateSheet(src){ rateState = {stars:(state.ratings[src] || {}).stars || 0}; drawRate(src); }
function drawRate(src){
  const review = $('#rv') ? $('#rv').value : '';
  sheet(`<h2>How much do you trust ${esc(src)}?</h2><p class="small muted">One rating per person, shown publicly. You can change it anytime.</p>
    <div class="rate" role="radiogroup" aria-label="Trust rating">${[1,2,3,4,5].map(v=>`<button role="radio" aria-checked="${rateState.stars===v}" class="${rateState.stars>=v?'on':''}" data-act="star" data-src="${esc(src)}" data-v="${v}" aria-label="${v} out of 5">${ico('star',24)}</button>`).join('')}</div>
    <div class="field"><label for="rv">Review (optional)</label><textarea class="input" id="rv" placeholder="What makes this source trustworthy or not?">${esc(review)}</textarea></div>
    <button class="btn block" data-act="rate-save" data-src="${esc(src)}" ${rateState.stars?'':'disabled'}>Save rating</button>`, 'Rate source');
}
function openSettings(){
  const r = state.reminders;
  full(header('Settings') + `<div class="body"><div class="pad">
    <div class="spread card" style="padding:12px 14px"><span><h3>Invest reminders</h3><p class="small muted">In Feed and News only</p></span><button class="switch" role="switch" data-act="rem-toggle" aria-checked="${r.on}" aria-label="Invest reminders"></button></div>
    <div class="stack" ${r.on?'':'hidden'}>${['15 scrolls','10 minutes','Once a day'].map(x=>`<button class="opt" role="radio" data-act="rem-every" data-v="${x}" aria-checked="${r.every===x}"><span class="radio"></span>${remLabel(x)}</button>`).join('')}<p class="help">Never late at night, and never right after a loss.</p></div>
    <div class="card" style="padding:12px 14px"><h3>How GoodHabits earns</h3><p class="small soft" style="margin-top:6px;line-height:1.55">No ads and no promotions, ever. How we earn is being finalised with our broker partner, and we'll show it here in plain words.</p></div>
    <div class="card" style="padding:12px 14px"><h3>Your Good ID</h3><p class="mono soft" style="margin-top:6px">${esc(state.user.goodId || 'good/riya')}</p></div>
  </div></div>`, 'Settings');
}
function friendSheet(k){
  const v = balances()[k] || 0;
  sheet(`<div class="row">${av(k)}<span><h2>${esc(H.friends[k])}</h2><p class="small muted mono">${esc(people[k].id)}</p></span></div>
    <p class="soft" style="font-size:16px">${v === 0 ? 'You\'re all settled up.' : v > 0 ? `${esc(H.friends[k].split(' ')[0])} owes you <b class="num up">${inr(v)}</b>` : `You owe ${esc(H.friends[k].split(' ')[0])} <b class="num down">${inr(-v)}</b>`}</p>
    ${v !== 0 ? `<button class="btn block" data-act="settle" data-k="${k}">Mark as settled</button><p class="note">Paid outside the app? Mark it settled. UPI settle-up inside GoodHabits comes later.</p>` : ''}`, H.friends[k]);
}

/* ---------- stage controls ---------- */
$('#theme-btn').addEventListener('click', () => {
  const root = document.documentElement, dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  root.dataset.theme = dark ? 'light' : 'dark';
});
$('#restart-btn').addEventListener('click', () => {
  onbStep = 0; state.user = {name:'', contact:'', monthly:null, goodId:'', topics:new Set(['Personal finance','Startups','Tech'])};
  state.reminders = {on:false, every:'15 scrolls'}; state.nudgeShown = false; state.scrolled = 0;
  go('feed'); onboarding();
});

/* ---------- boot ---------- */
// #feed, #news, #money, #profile or #hissab opens that tab directly (skips sign-up)
const startTab = location.hash.slice(1);
if (TABS.some(([k]) => k === startTab)) go(startTab); else { go('feed'); onboarding(); }
})();
