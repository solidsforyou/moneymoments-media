<title>OpenSource Everything Preview</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0B0D0C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;600;700&family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,800&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap">
<style>
/* Layout: one web app, five worlds. The OpenSource Everything shell is a dark hacker / game-library world;
   each product keeps its own world (OpenPrep light and simple, GoodHabit warm, India Money deliberately plain).
   Deliberately single-theme per world: every colour is set explicitly, so it reads the same on any host theme. */
:root{
  color-scheme:dark;
  /* shell: gunmetal + amber HUD */
  --ink:#0B0D0C; --ink-2:#121614; --ink-3:#1A1F1C; --steel:#2A312D; --hud:#FFB21A; --hud-dim:#8A6A22; --bone:#ECE9DF; --ash:#A7A99F; --ok:#5CD08A; --warn:#FF6A3D;
  /* OpenPrep */
  --p-bg:#FFFFFF; --p-ink:#0E1116; --p-mute:#5B6270; --p-line:#E6E8EE; --q-blue:#1B4DFF; --q-electric:#3FA9FF; --q-wash:#EEF4FF; --r-deep:#140B3A; --r-violet:#7C5CFF; --r-pink:#FF5FB8; --r-gold:#FFD36A;
  /* GoodHabit */
  --g-bg:#F6F7FC; --g-surface:#FFFFFF; --g-ink:#121633; --g-mute:#5D6488; --g-line:#DFE3EF; --g-accent:#2448FF; --g-wash:#E5EAFF; --g-up:#06774A; --g-down:#C02634; --g-pink:#C8155E;
  /* India Money (boring on purpose) */
  --m-bg:#EDEDED; --m-panel:#FFFFFF; --m-ink:#1D1D1D; --m-mute:#666; --m-line:#CFCFCF; --m-up:#0B7A3B; --m-down:#B3261E;
  --mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
  --hudf:"Chakra Petch", "Rajdhani", system-ui, sans-serif;
  --inter:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --gh-d:"Bricolage Grotesque", system-ui, sans-serif; --gh-b:"Figtree", system-ui, sans-serif;
  --serif:"Fraunces", Georgia, serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ink);color:var(--bone);font-family:var(--inter);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--ink)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--hud);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.col{max-width:620px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{margin:0;text-wrap:balance} p{margin:0}
[hidden]{display:none!important}
@media (max-width:520px){.wide-only{display:none}}
.sr{position:absolute;left:-9999px}

/* ---------- shell bar ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:rgba(11,13,12,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--steel)}
.logo{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:8px;font-family:var(--mono);font-weight:700;font-size:14px;letter-spacing:.02em;color:var(--bone);text-decoration:none;white-space:nowrap;background:none;border:0;padding:6px 0}
.logo b{color:var(--hud)}
.logo .cur{display:inline-block;width:8px;height:15px;background:var(--hud);animation:blink 1.1s steps(1) infinite;vertical-align:-2px}
@keyframes blink{50%{opacity:0}}
.grow{flex:1}
.chipbtn{flex:none;min-height:40px;padding:0 12px;border-radius:8px;border:1px solid var(--steel);background:var(--ink-2);color:var(--bone);font-family:var(--mono);font-size:12.5px;font-weight:700;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chipbtn.hot{border-color:var(--hud);color:var(--hud)}
.crumbs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:0 0 10px}
.crumbs button{flex:none;min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--steel);background:transparent;color:var(--ash);font-family:var(--mono);font-size:12px;font-weight:700}
.crumbs button[aria-current="page"]{background:var(--hud);border-color:var(--hud);color:var(--ink)}

/* ---------- home ---------- */
.home{background:radial-gradient(1200px 500px at 80% -10%,rgba(255,178,26,.10),transparent 60%),var(--ink)}
.hero{padding-block:34px 18px;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:28px;align-items:center}
@media (max-width:860px){.hero{grid-template-columns:1fr}}
.term{font-family:var(--mono);font-size:13px;color:var(--ok);line-height:1.7}
.term .dim{color:var(--ash)}
.hero h1{font-family:var(--hudf);font-weight:700;font-size:clamp(38px,7vw,74px);line-height:.95;letter-spacing:-.01em;text-transform:uppercase}
.hero h1 em{font-style:normal;color:var(--hud)}
.hero .lede{color:var(--ash);font-size:17px;max-width:56ch;margin-top:14px}
.ctas{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.btn-hud{min-height:48px;padding:0 18px;border:0;border-radius:6px;background:var(--hud);color:var(--ink);font-family:var(--hudf);font-weight:700;font-size:16px;letter-spacing:.06em;text-transform:uppercase;clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
.btn-line{min-height:48px;padding:0 18px;border:1px solid var(--steel);border-radius:6px;background:transparent;color:var(--bone);font-family:var(--hudf);font-weight:600;font-size:15px;letter-spacing:.06em;text-transform:uppercase}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{border:1px solid var(--steel);background:linear-gradient(180deg,var(--ink-2),var(--ink));padding:14px;border-radius:4px;position:relative}
.stat::before{content:"";position:absolute;left:0;top:0;width:14px;height:2px;background:var(--hud)}
.stat .v{font-family:var(--hudf);font-weight:700;font-size:30px;color:var(--bone)}
.stat .l{font-family:var(--mono);font-size:11.5px;color:var(--ash);text-transform:uppercase;letter-spacing:.06em}
.sect{padding-block:26px 6px}
.sect-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px;border-bottom:1px solid var(--steel);padding-bottom:8px}
.sect-h h2{font-family:var(--hudf);font-weight:700;font-size:22px;text-transform:uppercase;letter-spacing:.08em}
.sect-h span{font-family:var(--mono);font-size:12px;color:var(--ash)}
.lib{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:980px){.lib{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.lib{grid-template-columns:1fr}}
.tile{position:relative;border:1px solid var(--steel);border-radius:4px;overflow:hidden;background:var(--ink-2);text-align:left;padding:0;display:flex;flex-direction:column;min-height:240px;transition:transform .15s ease,border-color .15s}
.tile:hover{transform:translateY(-2px);border-color:var(--hud)}
.tile.big{grid-column:span 2;min-height:300px}
@media (max-width:520px){.tile.big{grid-column:span 1}}
.cover{flex:1;position:relative;min-height:150px;overflow:hidden}
.cover .tag{position:absolute;top:10px;left:10px;font-family:var(--mono);font-size:11px;font-weight:700;padding:3px 8px;border-radius:3px;background:rgba(0,0,0,.6);color:var(--hud);letter-spacing:.06em}
.cover .tag.free{color:var(--ok)}
.cover .lock{position:absolute;inset:0;display:grid;place-items:center;background:rgba(11,13,12,.66);font-family:var(--mono);font-size:12px;color:var(--ash);text-align:center;padding:12px}
.cover-title{position:absolute;left:14px;bottom:12px;right:14px;font-family:var(--hudf);font-weight:700;font-size:30px;line-height:1;text-transform:uppercase;color:#fff;text-shadow:0 2px 16px rgba(0,0,0,.5)}
.meta{padding:12px 14px;display:flex;flex-direction:column;gap:4px;border-top:1px solid var(--steel)}
.meta b{font-family:var(--hudf);font-size:15px;letter-spacing:.04em;text-transform:uppercase}
.meta span{font-size:13.5px;color:var(--ash)}
.why{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:980px){.why{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.why{grid-template-columns:1fr}}
.whycard{border:1px solid var(--steel);border-radius:4px;padding:16px;background:var(--ink-2);display:flex;flex-direction:column;gap:8px}
.whycard .k{font-family:var(--mono);font-size:11.5px;color:var(--hud);letter-spacing:.08em}
.whycard h3{font-family:var(--hudf);font-size:19px;text-transform:uppercase;letter-spacing:.04em}
.whycard p{color:var(--ash);font-size:14.5px}
.idcard{border:1px solid var(--hud-dim);border-radius:6px;background:linear-gradient(135deg,#17140B,var(--ink-2) 60%);padding:18px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center}
@media (max-width:560px){.idcard{grid-template-columns:1fr}}
.idbadges{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.vb{font-family:var(--mono);font-size:11.5px;font-weight:700;padding:4px 8px;border-radius:3px;border:1px solid var(--steel);color:var(--ash)}
.vb.v{border-color:var(--ok);color:var(--ok)}
.foot{padding-block:30px 60px;color:var(--ash);font-family:var(--mono);font-size:12px}

/* ---------- generic sheet / toast ---------- */
.scrim{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px max(18px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px));background:#fff;color:#111;display:flex;flex-direction:column;gap:12px;font-family:var(--inter)}
.sheet.dark{background:var(--ink-2);color:var(--bone);border:1px solid var(--steel);font-family:var(--inter)}
.sheet h2{font-size:21px;font-weight:800}
.sheet .x{align-self:flex-end;border:0;background:transparent;font-size:14px;min-height:40px;padding:0 6px;color:inherit;opacity:.7}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:90;background:#111;color:#fff;padding:12px 16px;border-radius:10px;font-size:14.5px;font-weight:600;max-width:90vw;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.opt{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:10px 12px;border-radius:12px;border:1px solid #E3E5EA;background:#fff;color:#111;text-align:left;font-weight:600}
.sheet.dark .opt{background:var(--ink-3);border-color:var(--steel);color:var(--bone)}
.opt[aria-pressed="true"]{border-color:var(--hud);box-shadow:inset 0 0 0 1px var(--hud)}
.codebox{font-family:var(--mono);font-size:13px;background:#0E0F10;color:#E8E6DE;border-radius:10px;padding:12px;white-space:pre-wrap;word-break:break-word;user-select:all}
.selrow{display:flex;flex-wrap:wrap;gap:8px}
select,.inp{font:inherit;min-height:46px;padding:0 12px;border-radius:10px;border:1px solid #D8DBE2;background:#fff;color:#111;width:100%}
.sheet.dark select,.sheet.dark .inp{background:var(--ink-3);border-color:var(--steel);color:var(--bone)}
label.lbl{font-size:13.5px;font-weight:700;display:block;margin-bottom:4px}

/* ---------- OpenPrep ---------- */
.prep{background:var(--p-bg);color:var(--p-ink);font-family:var(--inter);min-height:100vh}
.prep .bar{background:rgba(255,255,255,.94);border-bottom-color:var(--p-line)}
.prep .logo{color:var(--p-ink)} .prep .logo b{color:var(--q-blue)} .prep .logo .cur{background:var(--q-blue)}
.prep .chipbtn{background:#fff;border-color:var(--p-line);color:var(--p-ink)}
.prep .crumbs button{border-color:var(--p-line);color:var(--p-mute)}
.prep .crumbs button[aria-current="page"]{background:var(--p-ink);border-color:var(--p-ink);color:#fff}
.p-h1{font-weight:800;font-size:clamp(30px,6vw,44px);letter-spacing:-.025em;line-height:1.05}
.p-sub{color:var(--p-mute);font-size:17px;margin-top:8px}
.today{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:18px}
.today div{border:1px solid var(--p-line);border-radius:14px;padding:10px 12px}
.today b{display:block;font-size:22px;font-weight:800}
.today span{font-size:12.5px;color:var(--p-mute)}
.worlds{display:flex;flex-direction:column;gap:12px;margin-top:20px}
.world{border:0;border-radius:22px;padding:20px;text-align:left;min-height:128px;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;position:relative;overflow:hidden}
.world h3{font-size:26px;font-weight:800;letter-spacing:-.02em}
.world p{font-size:14.5px;opacity:.9}
.w-quant{background:var(--q-blue);color:#fff;background-image:linear-gradient(rgba(255,255,255,.14) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.14) 1px,transparent 1px);background-size:22px 22px}
.w-verbal{background:#FAFAF7;color:var(--p-ink);border:1px solid var(--p-line)!important}
.w-verbal h3{font-family:var(--serif);font-weight:700}
.w-reason{background:radial-gradient(120% 120% at 80% 0%,#3A1E9E 0%,var(--r-deep) 55%);color:#fff}
.w-reason::after{content:"";position:absolute;inset:0;background-image:radial-gradient(2px 2px at 20% 30%,#fff,transparent),radial-gradient(1.5px 1.5px at 70% 20%,#fff,transparent),radial-gradient(2px 2px at 85% 60%,var(--r-gold),transparent),radial-gradient(1.5px 1.5px at 40% 75%,#fff,transparent);opacity:.8;pointer-events:none}
.p-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.p-card{border:1px solid var(--p-line);border-radius:16px;padding:14px;text-align:left;background:#fff;color:var(--p-ink);display:flex;flex-direction:column;gap:4px}
.p-card b{font-size:15.5px}
.p-card span{font-size:13px;color:var(--p-mute)}
.price{font-weight:800;color:var(--q-blue)}
.p-btn{min-height:50px;border:0;border-radius:14px;padding:0 18px;background:var(--p-ink);color:#fff;font-weight:700;font-size:15.5px}
.p-btn.blue{background:var(--q-blue)}
.p-btn.ghost{background:#F1F3F7;color:var(--p-ink)}
.p-note{font-size:12.5px;color:var(--p-mute)}

/* quant world */
.quant{background:#0A2CB8;color:#fff;min-height:100vh;background-image:linear-gradient(rgba(255,255,255,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.08) 1px,transparent 1px);background-size:26px 26px}
.quant .bar,.reason .bar{background:rgba(5,16,80,.85);border-bottom-color:rgba(255,255,255,.15)}
.quant .crumbs button,.reason .crumbs button{border-color:rgba(255,255,255,.25);color:#CFE0FF}
.quant .crumbs button[aria-current="page"],.reason .crumbs button[aria-current="page"]{background:#fff;color:#0A2CB8;border-color:#fff}
.stage{position:relative;border-radius:22px;overflow:hidden;background:#06155E;border:1px solid rgba(255,255,255,.18);aspect-ratio:16/10;max-width:100%}
.cam{position:absolute;inset:0;transition:transform .9s cubic-bezier(.2,.8,.2,1);transform-origin:70% 45%}
.cam.zoom-screen{transform:scale(1.55) translate(-12%,4%)}
.cam.zoom-guy{transform:scale(1.5) translate(22%,-2%);transform-origin:20% 55%}
@media (prefers-reduced-motion:reduce){.cam{transition:none}}
.floor{position:absolute;left:0;right:0;bottom:0;height:24%;background:linear-gradient(180deg,#0B1F8E,#071457)}
.guy{position:absolute;left:4%;bottom:6%;width:26%}
.tv{position:absolute;right:5%;top:12%;width:62%;aspect-ratio:16/10;background:#0B0D12;border-radius:14px;border:6px solid #1B2238;box-shadow:0 20px 50px rgba(0,0,0,.45)}
.tv::after{content:"";position:absolute;left:46%;bottom:-22px;width:8%;height:16px;background:#1B2238;border-radius:0 0 4px 4px}
.screen{position:absolute;inset:0;border-radius:8px;overflow:hidden;background:linear-gradient(160deg,#0F3BFF,#0A1F99);display:flex;flex-direction:column;justify-content:center;padding:6% 7%;gap:6px;font-family:var(--inter)}
.screen .k{font-size:clamp(9px,1.6vw,12px);letter-spacing:.12em;text-transform:uppercase;color:#9CC8FF;font-weight:700}
.screen .big{font-size:clamp(15px,3.3vw,28px);font-weight:800;line-height:1.1}
.screen .eq{font-family:var(--mono);font-size:clamp(12px,2.6vw,22px);color:#fff;background:rgba(255,255,255,.1);padding:4px 8px;border-radius:6px;align-self:flex-start}
.screen .hl{color:#FFE27A}
.subs{position:absolute;left:4%;right:4%;bottom:3%;font-size:clamp(11px,2vw,14px);background:rgba(0,0,0,.55);padding:6px 10px;border-radius:8px;text-align:center}
.player-ctl{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.qbtn{min-height:44px;padding:0 14px;border-radius:12px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:#fff;font-weight:700}
.qbtn.on{background:#fff;color:#0A2CB8}
.qcard{background:#fff;color:var(--p-ink);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:10px}
.qopt{min-height:52px;border-radius:14px;border:1.5px solid var(--p-line);background:#fff;text-align:left;padding:0 14px;font-weight:600;color:var(--p-ink)}
.qopt.right{border-color:#0B9B55;background:#E8F8EF}
.qopt.wrong{border-color:#D23B3B;background:#FDEBEB}
.mentor{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:10px}
.bub{max-width:85%;padding:10px 12px;border-radius:14px;font-size:14.5px;line-height:1.45}
.bub.gg{background:#fff;color:var(--p-ink);align-self:flex-start}
.bub.me{background:#FFE27A;color:#1A1500;align-self:flex-end;font-weight:600}
.chaps{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.chap{flex:none;min-height:40px;padding:0 12px;border-radius:999px;border:1px solid rgba(255,255,255,.3);background:transparent;color:#fff;font-size:13.5px;font-weight:600}
.chap.on{background:#fff;color:#0A2CB8}

/* verbal world */
.verbal{background:#FAFAF7;color:#16171A;min-height:100vh}
.verbal .bar{background:rgba(250,250,247,.94);border-bottom-color:#E7E5DE}
.verbal .logo{color:#16171A} .verbal .logo b{color:#16171A} .verbal .logo .cur{background:#16171A}
.verbal .chipbtn{background:#fff;border-color:#E7E5DE;color:#16171A}
.verbal .crumbs button{border-color:#E7E5DE;color:#6A6A6A}
.verbal .crumbs button[aria-current="page"]{background:#16171A;color:#fff;border-color:#16171A}
.modes{display:inline-flex;gap:4px;padding:4px;border-radius:12px;background:#EFEDE6}
.modes button{min-height:42px;padding:0 14px;border:0;border-radius:9px;background:transparent;font-weight:600;color:#55534D;font-size:14px}
.modes button[aria-pressed="true"]{background:#fff;color:#16171A;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.article{font-family:var(--serif);font-size:19px;line-height:1.7;color:#1C1C1C;max-width:62ch}
.article p+p{margin-top:16px}
.article h2{font-family:var(--serif);font-size:30px;line-height:1.15;margin-bottom:10px}
.kicker{font-family:var(--inter);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#8A6A1A;font-weight:700}

/* reasoning world */
.reason{color:#fff;min-height:100vh;background:radial-gradient(120% 90% at 70% -10%,#4A25C9 0%,#1A0E52 45%,#090522 100%)}
#sky{position:fixed;inset:0;z-index:0;pointer-events:none}
.reason main{position:relative;z-index:1}
.table-scene{position:relative;width:100%;max-width:520px;aspect-ratio:1;margin:0 auto}
.rtable{position:absolute;inset:26%;border-radius:50%;background:radial-gradient(circle at 40% 35%,#8C6BFF,#3B1FA6 60%,#1D0E62);box-shadow:0 0 60px rgba(124,92,255,.6),inset 0 0 40px rgba(255,255,255,.15)}

<script>
(function(){

const app = $('#app'), layer = $('#layer');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inr = n => (n < 0 ? '−' : '') + '₹' + Math.abs(Math.round(n)).toLocaleString('en-IN');
let toastT; function toast(m){ $('#toastslot').innerHTML = `<div class="toast" role="status">${esc(m)}</div>`; clearTimeout(toastT); toastT = setTimeout(() => $('#toastslot').innerHTML = '', 2600); }
function sheet(html, dark){ layer.innerHTML = `<div class="scrim" data-act="scrim"><div class="sheet ${dark?'dark':''}" role="dialog" aria-modal="true" data-stop><button class="x" data-act="close">Close ✕</button>${html}</div></div>`; const f = layer.querySelector('input,select,button:not(.x)'); f && f.focus({preventScroll:true}); }

function render(){
  clearTimers();
  let r = location.hash.slice(1); if (!ROUTES.includes(r)) r = 'home';

  app.innerHTML = bar(r) + html;

}

const CLUES = [

function seatPos(i){ const a = -Math.PI/2 + i * Math.PI/3; return [50 + 39*Math.cos(a), 50 + 39*Math.sin(a)]; }
function vReason(){

    <div class="table-scene" aria-label="Round table with six seats"><div class="rtable"></div>
      ${[0,1,2,3,4,5].map(i => { const [x,y] = seatPos(i), p = bySeat[i]; return `<div class="seat ${p?'filled':''} ${p && Object.values(last).includes(i)?'glow':''}" style="left:${x}%;top:${y}%">${p || '?'}</div>`; }).join('')}</div>
    <div style="display:flex;flex-direction:column;gap:8px">${CLUES.map((c,i) => `<div class="clue ${i<=st?'done':''}"><span class="n">${i+1}</span><span>${i<=st?esc(c.t):'Next clue…'}</span></div>`).join('')}</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="qbtn" data-act="rstep" data-d="-1">← Back</button><button class="qbtn on" data-act="rstep" data-d="1" ${st>=CLUES.length-1?'disabled':''}>Next clue →</button></div>
    ${st>=CLUES.length-1?`<div class="qcard"><p style="font-size:18px;font-weight:700">Who sits opposite C?</p>${['A','B','E','F'].map((o,i) => `<button class="qopt ${ra==null?'':o==='B'?'right':i===ra?'wrong':''}" data-act="rans" data-i="${i}" ${ra!=null?'disabled':''}>${o}</button>`).join('')}${ra==null?'':`<p>${['A','B','E','F'][ra]==='B'?'Yes! C is in seat 5, B in seat 2: straight across.':'Look again: C is straight across from B.'} Flip the table in your head and it stays true, that's why it works.</p>`}</div>`:''}
  </main>`;
}
let skyRaf; function startSky(){ const c = $('#sky'), x = c.getContext('2d'); const stars = Array.from({length:120}, () => ({x:Math.random(), y:Math.random(), r:Math.random()*1.6+.3, s:Math.random()*.6+.2}));
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  function size(){ c.width = innerWidth * devicePixelRatio; c.height = innerHeight * devicePixelRatio; }
  size(); if (!startSky.bound) { addEventListener('resize', size); startSky.bound = true; }
  (function f(t){ x.clearRect(0,0,c.width,c.height); stars.forEach(s => { const tw = reduce ? .8 : .5 + .5*Math.sin(t/900*s.s + s.x*20); x.globalAlpha = tw; x.fillStyle = s.r > 1.5 ? '#FFD36A' : '#fff'; x.beginPath(); x.arc(s.x*c.width, s.y*c.height, s.r*devicePixelRatio, 0, 6.283); x.fill(); }); if (!reduce) skyRaf = requestAnimationFrame(f); })(0);
}

function stepNow(){ const g = S.game; return ERAS[g.era].steps[g.i]; }

function choose(c){
  const g = S.game, st = stepNow();
  if (c === 'spend'){ g.cash -= st.cost*100; g.spentOnly += st.cost*100; g.log.push(`${st.date}: bought the soup (${inr(st.cost)}).`); return nextStep(); }
  if (c === 'match'){ g.cash -= st.cost*100; g.log.push(`${st.date}: bought the soup and matched it with an investment.`); return toMoney(st.cost*100); }
  if (c === 'tip'){ g.cash -= 200000; g.log.push(`${st.date}: put ₹2,000 in the tip. It fell 70% within months.`); g.cash += 60000; return nextStep(); }
  if (c === 'steady'){ g.log.push(`${st.date}: skipped the tip and invested ₹500 the boring way.`); return toMoney(50000); }
  if (c === 'skip'){ g.log.push(`${st.date}: skipped the tip.`); return nextStep(); }
  if (c === 'sell'){ const v = worth(st); g.cash += v; g.hold = {idx:0, gold:0, fd:[]}; g.log.push(`${st.date}: Sold everything for ${inr(v/100)}.`); return nextStep(); }
  if (c === 'hold'){ g.log.push(`${st.date}: held, and invested ₹500 more.`); return toMoney(50000); }
}

function placeOrder(){
  const g = S.game, st = stepNow(), a = g.alloc;

}

      <div class="whycard"><span class="k">BOARDS</span><h3>Prep boards</h3><p>CAT Quant · DILR puzzles · Verbal case club · Career switchers. Moderated, no spam, no ads.</p><button class="btn-line" data-act="board">Open CAT Quant board</button></div>
      <div class="whycard"><span class="k">SUPPORT</span><h3>Donations</h3><p>Back the people who open their work: UPI, GitHub Sponsors or Solana, straight to them. We take ₹0; only the payment fee passes through.</p><button class="btn-line" data-act="donate">Donate to a creator</button></div>
    </div></main>`;
}

/* ---------------- events ---------------- */
document.addEventListener('click', e => {
  const scr = e.target.closest('[data-act="scrim"]'); if (scr && !e.target.closest('[data-stop]')) { closeSheet(); return; }
  const b = e.target.closest('[data-act]'); if (!b || b.dataset.act === 'scrim') return;
  const a = b.dataset.act;
  switch (a) {
    case 'nav': closeSheet(); if (location.hash.slice(1) === b.dataset.r) render(); else go(b.dataset.r); break;
    case 'close': closeSheet(); break;
    case 'locked': toast(`${b.dataset.why || 'This'} is coming after launch.`); break;
    case 'signin': sheet(`<h2>Sign in with OpenID</h2><p style="color:var(--ash)">One ID everywhere: PrepID in OpenPrep, GoodID in GoodHabit.</p><div><label class="lbl" for="oid">Your OpenID</label><input class="inp" id="oid" value="good/riya" autocapitalize="off"></div><button class="btn-hud" data-act="signin-ok">Continue</button><p style="font-size:12.5px;color:var(--ash)">Preview: no account is created.</p>`, true); break;
    case 'signin-ok': S.user = ($('#oid').value || 'good/riya').trim(); closeSheet(); render(); toast(`Signed in as ${S.user}`); break;
    case 'me': toast(`${S.user} · same ID in every product`); break;
    case 'pwa': sheet(`<h2>Put it on your home screen</h2><p>It opens full-screen like an app. No app store, no download, no ads.</p><p><b>Android (Chrome):</b> ⋮ menu → Add to Home screen.</p><p><b>iPhone (Safari):</b> Share → Add to Home Screen.</p>`); break;
    /* OpenPrep */
    case 'plans': sheet(`<h2>Plans</h2><p style="color:#5B6270">Learning stays free. Pay only for what costs us money to run.</p>
      ${[['Free','10 reels + 1 long video a day, 3 practice questions, 10 AI-mentor minutes','₹0'],['₹99 course','A full 50-video career course, yours for good','₹99'],['Open Credits','10 credits for mock tests, AI mentor time and more','₹100'],['OpenPrep Pass','Unlimited reels and videos, free share links for friends, AI mentor','₹199/mo'],['OpenPlan','Everything paid across OpenSource Everything + GoodGuy coaching + 10 credits','₹299/mo']].map(([n,d,p]) => `<div class="opt" style="justify-content:space-between"><span><b style="display:block">${n}</b><span style="font-weight:500;font-size:13.5px;color:#5B6270">${d}</span></span><b style="color:#1B4DFF;white-space:nowrap">${p}</b></div>`).join('')}<p style="font-size:12.5px;color:#5B6270">Preview: nothing is charged.</p>`); break;
    case 'lang': sheet(`<h2>Learn in your language</h2><p>Every video is made in Hinglish first, then English. Regional packs translate all videos, voice and on-screen text.</p>${['Tamil','Telugu','Bengali','Marathi','Kannada'].map(l => `<div class="opt" style="justify-content:space-between"><span>${l}</span><b style="color:#1B4DFF">₹100</b></div>`).join('')}`); break;
    case 'course': if (S.free.long > 0) { S.free.long--; toast(`Today's free 10-minute video from "${b.dataset.c}" is playing (preview)`); render(); } else sheet(`<h2>${esc(b.dataset.c)}</h2><p>You've used today's free video. Get all 50 videos for ₹99, or come back tomorrow.</p><button class="p-btn blue">Get the course · ₹99 (preview)</button>`); break;
    case 'chap': S.prep.chap = +b.dataset.i; S.prep.step = 0; S.prep.playing = false; clearTimers(); render(); break;
    case 'beat': { const L = LESSONS[S.prep.chap]; S.prep.step = Math.max(0, Math.min(L.beats.length-1, S.prep.step + +b.dataset.d)); drawLesson(); updateBeatLabel(); break; }
    case 'play': togglePlay(); break;
    case 'answer': S.prep.answered = +b.dataset.i; render(); break;
    case 'ask': { const q = b.dataset.q, A = {'Explain step 2 again':'The second discount is on ₹900, not ₹1,200. 10% of 900 is 90, so you pay 810. The base keeps changing.','Give me a harder one':'Try: a price rises 25% and you want it back to the original. What % cut do you need? (Answer: 20%, because 125 × 0.8 = 100.)','Why not 35%?':'Because 10% is taken from a smaller number (900). 25% of 1,200 is 300; 10% of 900 is 90. 300 + 90 = 390, which is 32.5% of 1,200.'}; if (S.free.mentor <= 0) { toast('Free mentor minutes used. Open Credits from ₹100.'); break; } S.free.mentor = Math.max(0, S.free.mentor - 1); S.prep.mentor.push(['me', q], ['gg', A[q]]); render(); document.querySelector('#mlog').lastElementChild.scrollIntoView({block:'nearest'}); break; }
    case 'vmode': { const m = b.dataset.m; if (m === 'watch' && S.prep.mode !== 'watch') { if (S.free.long <= 0) { toast('Today\'s free long video is used. Read it instead, or get the Pass.'); break; } S.free.long--; } S.prep.mode = m; render(); break; }
    case 'vans': S.prep.vAns = +b.dataset.i; render(); break;
    case 'rstep': S.prep.rstep = Math.max(0, Math.min(CLUES.length-1, S.prep.rstep + +b.dataset.d)); S.prep.rAnswer = null; render(); break;
    case 'rans': S.prep.rAnswer = +b.dataset.i; render(); break;
    /* GoodHabit */
    case 'htab': S.habitTab = b.dataset.t; S.chatWith = null; if (location.hash.slice(1) !== 'habit') go('habit'); else render(); break;
    case 'share': sheet(`<h2>Share with a friend</h2><p style="color:#5D6488">They can watch it free, even past their daily limit.</p>${Object.keys(S.hissab).map(k => `<button class="opt" data-act="sendreel" data-k="${k}" data-i="${b.dataset.i}">${hav(k)} ${esc(S.hissab[k].name)}</button>`).join('')}`); break;
    case 'sendreel': { const h = S.hissab[b.dataset.k]; h.msgs.push(['me', `Watch this: "${REELS[+b.dataset.i].h}"`]); closeSheet(); toast(`Sent to ${h.name.split(' ')[0]} in Chats`); break; }
    case 'like': toast('Liked'); break;
    case 'openchat': S.chatWith = b.dataset.k; render(); break;
    case 'backchats': S.chatWith = null; render(); break;
    case 'accept': { const h = S.hissab[b.dataset.k]; h.state = 'connected'; h.msgs.push(['hissab', 'Hissab connected. Shared expenses will show here.']); render(); toast('Hissab connected'); break; }
    case 'decline': { const h = S.hissab[b.dataset.k]; h.state = 'chat'; render(); toast('Invite declined. They won\'t be told why.'); break; }
    case 'invite': { const k = b.dataset.k, h = S.hissab[k]; h.state = 'invite-out'; h.msgs.push(['hissab', `You sent ${h.name.split(' ')[0]} a Hissab invite.`]); render(); timers.push(setTimeout(() => { h.state = 'connected'; h.msgs.push(['hissab', `${h.name.split(' ')[0]} accepted. Your Hissab is live.`]); if (S.chatWith === k) render(); toast(`${h.name.split(' ')[0]} accepted your Hissab invite`); }, 1800)); break; }
    case 'newhissab': sheet(`<h2>New Hissab invite</h2><p style="color:#5D6488">They'll get an invite to accept or decline. Nobody can be added without saying yes.</p><div><label class="lbl" for="hid">Their Good ID</label><input class="inp" id="hid" placeholder="good/arjun" autocapitalize="off"></div><button class="gbtn" data-act="sendinvite" style="min-height:50px">Send invite</button>`); break;
    case 'sendinvite': { const v = ($('#hid').value || '').trim().toLowerCase(); if (!/^good\/[a-z0-9.]{2,}$/.test(v)) { toast('Use a Good ID like good/arjun'); break; } const k = v.replace('good/','').replace(/\W/g,''); S.hissab[k] = {name: k[0].toUpperCase()+k.slice(1), id:v, bg:'#4A3F8F', state:'invite-out', bal:0, msgs:[['hissab','Hissab invite sent. Waiting for them to accept.']]}; closeSheet(); render(); toast('Invite sent'); break; }
    case 'addhissab': sheet(`<h2>Add to Hissab</h2><div><label class="lbl" for="hw">What was it?</label><input class="inp" id="hw" placeholder="Chai, cab, movie"></div><div><label class="lbl" for="ha">Amount (₹)</label><input class="inp" id="ha" inputmode="decimal" placeholder="600"></div><div class="seg2" role="group" aria-label="Who paid"><button data-act="hpaid" data-p="me" aria-pressed="true">I paid</button><button data-act="hpaid" data-p="them" aria-pressed="false">They paid</button></div><p style="font-size:13.5px;color:#5D6488">Split equally between you two.</p><button class="gbtn" data-act="hsave" style="min-height:50px">Add</button>`); S.hpaid = 'me'; break;
    case 'hpaid': S.hpaid = b.dataset.p; b.parentElement.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b)); break;
    case 'hsave': { const amt = Math.round(parseFloat(String($('#ha').value).replace(/[,\s₹]/g,'')) * 100); if (!(amt > 0)) { toast('Type an amount like 600'); break; } const h = S.hissab[S.chatWith], what = $('#hw').value.trim() || 'Expense', half = Math.round(amt / 2), first = h.name.split(' ')[0]; h.bal += S.hpaid === 'me' ? half : -half; h.msgs.push(['hissab', `Hissab · ${what} ${inr(amt/100)} · ${S.hpaid==='me'?'you paid':first+' paid'} · split 2 ways → ${S.hpaid==='me'?`${first} owes you ${inr(half/100)}`:`you owe ${first} ${inr(half/100)}`}`]); closeSheet(); render(); break; }
    case 'settle': { const h = S.hissab[b.dataset.k]; if (!h.bal) { toast('Already settled'); break; } h.msgs.push(['hissab', `Settled ${inr(Math.abs(h.bal)/100)}. All square.`]); h.bal = 0; render(); toast('Marked as settled · UPI settle-up comes later'); break; }
    /* practice */
    case 'pmode': if (b.dataset.m === 'profile') profileSheet(); break;
    case 'pmapgo': pmap(); break;
    case 'pwho': S.game.who = b.dataset.k; render(); break;
    case 'pdiff': S.game.diff = b.dataset.k; render(); break;
    case 'pera': S.game.era = b.dataset.k; render(); break;
    case 'pstart': newGame(S.game.era); render(); break;
    case 'demo': S.game = S.game || {}; newGame(b.dataset.k); S.habitTab = 'practice'; if (location.hash.slice(1) !== 'practice') go('practice'); else render(); break;
    case 'ch': choose(b.dataset.c); break;
    case 'quitgame': S.game = null; S.habitTab = 'practice'; if (location.hash.slice(1) !== 'practice') go('practice'); else render(); break;
    case 'alloc': { const g = S.game, k = b.dataset.k, d = +b.dataset.d, left = g.pending - g.alloc.idx - g.alloc.gold - g.alloc.fd; if (d > 0 && left < d) { toast('Nothing left to place'); break; } g.alloc[k] = Math.max(0, g.alloc[k] + d); render(); break; }
    case 'placeorder': placeOrder(); break;
    /* skills, library, community */
    case 'sfilter': S.skillFilter = b.dataset.f; render(); break;
    case 'import': importSheet(b.dataset.n, b.dataset.t); S.importName = b.dataset.n; break;
    case 'pickai': b.parentElement.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b)); $('#paste').textContent = pasteText(S.importName, b.dataset.a); break;
    case 'copypaste': { const t = $('#paste').textContent; const done = () => toast('Copied. Paste it into your AI.'); try { navigator.clipboard.writeText(t).then(done, () => { selectPaste(); toast('Select and copy the message above'); }); } catch (err) { selectPaste(); toast('Select and copy the message above'); } break; }
    case 'buyskill': closeSheet(); toast(`${$('#ss') ? '' : ''}Pack ready for your market (preview, nothing charged)`); break;
    case 'github': S.gh = !S.gh; render(); toast(S.gh ? 'GitHub connected (preview)' : 'Disconnected'); break;
    case 'board': sheet(`<h2>CAT Quant board</h2><p style="color:var(--ash)">1,240 members (sample) · moderated · 18+</p>${['Shortcut for successive % changes?','DILR set 4 from yesterday: my approach','Daily 3-question streak thread'].map(t => `<div class="opt">${t}</div>`).join('')}`, true); break;
    case 'donate': sheet(`<h2>Support @finwithneha</h2><p style="color:var(--ash)">Straight to the creator. We take ₹0.</p><div class="opt" style="justify-content:space-between"><span>₹100 by UPI</span><span>creator gets ₹97.64</span></div><div class="opt" style="justify-content:space-between"><span>Cover the fees</span><span>you pay ₹102.36</span></div><div class="opt">Solana · wallet verified · straight to the creator</div><p style="font-size:12.5px;color:var(--ash)">Payment fee about 2% plus GST on the fee passes through. Donations may be taxable for the creator.</p>`, true); break;
  }
});
function selectPaste(){ const el = $('#paste'); const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
function updateBeatLabel(){ const L = LESSONS[S.prep.chap], b = L.beats[S.prep.step], s = document.querySelector('.player-ctl span'); if (s) s.textContent = `Beat ${S.prep.step+1}/${L.beats.length} · camera: ${b.cam.replace('-',' ')}`; }
function togglePlay(){
  S.prep.playing = !S.prep.playing; $('#playbtn').textContent = S.prep.playing ? 'Pause' : '▶ Play lesson';
  clearTimers();
  if (S.prep.playing) {
    if (S.free.reels > 0 && S.prep.step === 0) S.free.reels--;
    const tick = () => { const L = LESSONS[S.prep.chap]; if (S.prep.step >= L.beats.length - 1) { S.prep.playing = false; const pb = $('#playbtn'); if (pb) pb.textContent = '↻ Replay'; S.prep.step = L.beats.length - 1; drawLesson(); return; } S.prep.step++; drawLesson(); updateBeatLabel(); };
    drawLesson(); timers.push(setInterval(tick, 3200));
  } else drawLesson();
}
document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'cform') { const v = $('#cin').value.trim(); if (!v) return; S.hissab[S.chatWith].msgs.push(['me', v]); render(); $('#cin') && $('#cin').focus(); }
  if (e.target.id === 'libform') { S.libQ = $('#libq').value.trim(); render(); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && layer.innerHTML) closeSheet(); });

render();
})();
</script>
