<title>OpenSource Everything Preview</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#F6F5F1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,800&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap">
<style>
/* Layout: one web app, separate worlds. OpenSource Everything is a bright, friendly app library for everyone;
   each product keeps its own world (OpenPrep light and simple, GoodHabit a calm money app, Markets like a stocks app).
   Deliberately single-theme per world: every colour is set explicitly, so it reads the same on any host theme. */
:root{
  color-scheme:dark;
  /* shell: gunmetal + amber HUD */
  --ink:#0B0D0C; --ink-2:#121614; --ink-3:#1A1F1C; --steel:#2A312D; --hud:#FFB21A; --hud-dim:#8A6A22; --bone:#ECE9DF; --ash:#A7A99F; --ok:#5CD08A; --warn:#FF6A3D;
  /* OpenPrep */
  --p-bg:#FFFFFF; --p-ink:#0E1116; --p-mute:#5B6270; --p-line:#E6E8EE; --q-blue:#1B4DFF; --q-electric:#3FA9FF; --q-wash:#EEF4FF; --r-deep:#140B3A; --r-violet:#7C5CFF; --r-pink:#FF5FB8; --r-gold:#FFD36A;
  /* GoodHabit: a finance world, ledger paper and ink */
  --g-bg:#F4F3EE; --g-surface:#FFFFFF; --g-ink:#17181A; --g-mute:#5E6166; --g-line:#DEDCD3; --g-accent:#17181A; --g-wash:#ECEAE2; --g-up:#0B7A3B; --g-down:#B3261E; --g-pink:#0B7A3B;
  /* India Money (boring on purpose) */
  --m-bg:#EDEDED; --m-panel:#FFFFFF; --m-ink:#1D1D1D; --m-mute:#666; --m-line:#CFCFCF; --m-up:#0B7A3B; --m-down:#B3261E;
  --mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
  --hudf:"Chakra Petch", "Rajdhani", system-ui, sans-serif;
  --inter:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --gh-d:"Bricolage Grotesque", system-ui, sans-serif; --gh-b:"Figtree", system-ui, sans-serif;
  --serif:"Fraunces", Georgia, serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ink);color:var(--bone);font-family:var(--inter);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--ink)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--hud);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.col{max-width:620px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{margin:0;text-wrap:balance} p{margin:0}
[hidden]{display:none!important}
@media (max-width:520px){.wide-only{display:none}}
.sr{position:absolute;left:-9999px}

/* ---------- shell bar ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:rgba(11,13,12,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--steel)}
.logo{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:8px;font-family:var(--mono);font-weight:700;font-size:14px;letter-spacing:.02em;color:var(--bone);text-decoration:none;white-space:nowrap;background:none;border:0;padding:6px 0}
.logo b{color:var(--hud)}
.logo .cur{display:inline-block;width:8px;height:15px;background:var(--hud);animation:blink 1.1s steps(1) infinite;vertical-align:-2px}
@keyframes blink{50%{opacity:0}}
.grow{flex:1}
.chipbtn{flex:none;min-height:40px;padding:0 12px;border-radius:8px;border:1px solid var(--steel);background:var(--ink-2);color:var(--bone);font-family:var(--mono);font-size:12.5px;font-weight:700;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chipbtn.hot{border-color:var(--hud);color:var(--hud)}
.crumbs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:0 28px 10px 0;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 40px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 40px),transparent)}
@media(min-width:900px){.crumbs{-webkit-mask-image:none;mask-image:none;padding-right:0}}
.crumbs button{flex:none;min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--steel);background:transparent;color:var(--ash);font-family:var(--mono);font-size:12px;font-weight:700}
.crumbs button[aria-current="page"]{background:var(--hud);border-color:var(--hud);color:var(--ink)}

/* ---------- home ---------- */
.home{background:radial-gradient(1200px 500px at 80% -10%,rgba(255,178,26,.10),transparent 60%),var(--ink)}
.hero{padding-block:34px 18px;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:28px;align-items:center}
@media (max-width:860px){.hero{grid-template-columns:1fr}}
.term{font-family:var(--mono);font-size:13px;color:var(--ok);line-height:1.7}
.term .dim{color:var(--ash)}
.hero h1{font-family:var(--hudf);font-weight:700;font-size:clamp(38px,7vw,74px);line-height:.95;letter-spacing:-.01em;text-transform:uppercase}
.hero h1 em{font-style:normal;color:var(--hud)}
.hero .lede{color:var(--ash);font-size:17px;max-width:56ch;margin-top:14px}
.ctas{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.btn-hud{min-height:48px;padding:0 18px;border:0;border-radius:6px;background:var(--hud);color:var(--ink);font-family:var(--hudf);font-weight:700;font-size:16px;letter-spacing:.06em;text-transform:uppercase;clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
.btn-line{min-height:48px;padding:0 18px;border:1px solid var(--steel);border-radius:6px;background:transparent;color:var(--bone);font-family:var(--hudf);font-weight:600;font-size:15px;letter-spacing:.06em;text-transform:uppercase}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{border:1px solid var(--steel);background:linear-gradient(180deg,var(--ink-2),var(--ink));padding:14px;border-radius:4px;position:relative}
.stat::before{content:"";position:absolute;left:0;top:0;width:14px;height:2px;background:var(--hud)}
.stat .v{font-family:var(--hudf);font-weight:700;font-size:30px;color:var(--bone)}
.stat .l{font-family:var(--mono);font-size:11.5px;color:var(--ash);text-transform:uppercase;letter-spacing:.06em}
.sect{padding-block:26px 6px}
.sect-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px;border-bottom:1px solid var(--steel);padding-bottom:8px}
.sect-h h2{font-family:var(--hudf);font-weight:700;font-size:22px;text-transform:uppercase;letter-spacing:.08em}
.sect-h span{font-family:var(--mono);font-size:12px;color:var(--ash)}
.lib{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:980px){.lib{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.lib{grid-template-columns:1fr}}
.tile{position:relative;border:1px solid var(--steel);border-radius:4px;overflow:hidden;background:var(--ink-2);text-align:left;padding:0;display:flex;flex-direction:column;min-height:240px;transition:transform .15s ease,border-color .15s}
.tile:hover{transform:translateY(-2px);border-color:var(--hud)}
.tile.big{grid-column:span 2;min-height:300px}
@media (max-width:520px){.tile.big{grid-column:span 1}}
.cover{flex:1;position:relative;min-height:150px;overflow:hidden}
.cover .tag{position:absolute;top:10px;left:10px;font-family:var(--mono);font-size:11px;font-weight:700;padding:3px 8px;border-radius:3px;background:rgba(0,0,0,.6);color:var(--hud);letter-spacing:.06em}
.cover .tag.free{color:var(--ok)}
.cover .lock{position:absolute;inset:0;display:grid;place-items:center;background:rgba(11,13,12,.66);font-family:var(--mono);font-size:12px;color:var(--ash);text-align:center;padding:12px}
.cover-title{position:absolute;left:14px;bottom:12px;right:14px;font-family:var(--hudf);font-weight:700;font-size:30px;line-height:1;text-transform:uppercase;color:#fff;text-shadow:0 2px 16px rgba(0,0,0,.5)}
.meta{padding:12px 14px;display:flex;flex-direction:column;gap:4px;border-top:1px solid var(--steel)}
.meta b{font-family:var(--hudf);font-size:15px;letter-spacing:.04em;text-transform:uppercase}
.meta span{font-size:13.5px;color:var(--ash)}
.why{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:980px){.why{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.why{grid-template-columns:1fr}}
.whycard{border:1px solid var(--steel);border-radius:4px;padding:16px;background:var(--ink-2);display:flex;flex-direction:column;gap:8px}
.whycard .k{font-family:var(--mono);font-size:11.5px;color:var(--hud);letter-spacing:.08em}
.whycard h3{font-family:var(--hudf);font-size:19px;text-transform:uppercase;letter-spacing:.04em}
.whycard p{color:var(--ash);font-size:14.5px}
.idcard{border:1px solid var(--hud-dim);border-radius:6px;background:linear-gradient(135deg,#17140B,var(--ink-2) 60%);padding:18px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center}
@media (max-width:560px){.idcard{grid-template-columns:1fr}}
.idbadges{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.vb{font-family:var(--mono);font-size:11.5px;font-weight:700;padding:4px 8px;border-radius:3px;border:1px solid var(--steel);color:var(--ash)}
.vb.v{border-color:var(--ok);color:var(--ok)}
.foot{padding-block:30px 60px;color:var(--ash);font-family:var(--mono);font-size:12px}

/* ---------- generic sheet / toast ---------- */
.scrim{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px max(18px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px));background:#fff;color:#111;display:flex;flex-direction:column;gap:12px;font-family:var(--inter)}
.sheet.dark{background:var(--ink-2);color:var(--bone);border:1px solid var(--steel);font-family:var(--inter)}
.sheet h2{font-size:21px;font-weight:800}
.sheet .x{align-self:flex-end;border:0;background:transparent;font-size:14px;min-height:40px;padding:0 6px;color:inherit;opacity:.7}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:90;background:#111;color:#fff;padding:12px 16px;border-radius:10px;font-size:14.5px;font-weight:600;max-width:90vw;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.opt{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:10px 12px;border-radius:12px;border:1px solid #E3E5EA;background:#fff;color:#111;text-align:left;font-weight:600}
.sheet.dark .opt{background:var(--ink-3);border-color:var(--steel);color:var(--bone)}
.opt[aria-pressed="true"]{border-color:var(--hud);box-shadow:inset 0 0 0 1px var(--hud)}
.codebox{font-family:var(--mono);font-size:13px;background:#0E0F10;color:#E8E6DE;border-radius:10px;padding:12px;white-space:pre-wrap;word-break:break-word;user-select:all}
.selrow{display:flex;flex-wrap:wrap;gap:8px}
select,.inp{font:inherit;min-height:46px;padding:0 12px;border-radius:10px;border:1px solid #D8DBE2;background:#fff;color:#111;width:100%}
.sheet.dark select,.sheet.dark .inp{background:var(--ink-3);border-color:var(--steel);color:var(--bone)}
label.lbl{font-size:13.5px;font-weight:700;display:block;margin-bottom:4px}

/* ---------- OpenPrep ---------- */
.prep{background:var(--p-bg);color:var(--p-ink);font-family:var(--inter);min-height:100vh}
.prep .bar{background:rgba(255,255,255,.94);border-bottom-color:var(--p-line)}
.prep .logo{color:var(--p-ink)} .prep .logo b{color:var(--q-blue)} .prep .logo .cur{background:var(--q-blue)}
.prep .chipbtn{background:#fff;border-color:var(--p-line);color:var(--p-ink)}
.prep .crumbs button{border-color:var(--p-line);color:var(--p-mute)}
.prep .crumbs button[aria-current="page"]{background:var(--p-ink);border-color:var(--p-ink);color:#fff}
.p-h1{font-weight:800;font-size:clamp(30px,6vw,44px);letter-spacing:-.025em;line-height:1.05}
.p-sub{color:var(--p-mute);font-size:17px;margin-top:8px}
.today{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:18px}
.today div{border:1px solid var(--p-line);border-radius:14px;padding:10px 12px}
.today b{display:block;font-size:22px;font-weight:800}
.today span{font-size:12.5px;color:var(--p-mute)}
.worlds{display:flex;flex-direction:column;gap:12px;margin-top:20px}
.world{border:0;border-radius:22px;padding:20px;text-align:left;min-height:128px;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;position:relative;overflow:hidden}
.world h3{font-size:26px;font-weight:800;letter-spacing:-.02em}
.world p{font-size:14.5px;opacity:.9}
.w-quant{background:var(--q-blue);color:#fff;background-image:linear-gradient(rgba(255,255,255,.14) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.14) 1px,transparent 1px);background-size:22px 22px}
.w-verbal{background:#FAFAF7;color:var(--p-ink);border:1px solid var(--p-line)!important}
.w-verbal h3{font-family:var(--serif);font-weight:700}
.w-reason{background:radial-gradient(120% 120% at 80% 0%,#3A1E9E 0%,var(--r-deep) 55%);color:#fff}
.w-reason::after{content:"";position:absolute;inset:0;background-image:radial-gradient(2px 2px at 20% 30%,#fff,transparent),radial-gradient(1.5px 1.5px at 70% 20%,#fff,transparent),radial-gradient(2px 2px at 85% 60%,var(--r-gold),transparent),radial-gradient(1.5px 1.5px at 40% 75%,#fff,transparent);opacity:.8;pointer-events:none}
.p-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.p-card{border:1px solid var(--p-line);border-radius:16px;padding:14px;text-align:left;background:#fff;color:var(--p-ink);display:flex;flex-direction:column;gap:4px}
.p-card b{font-size:15.5px}
.p-card span{font-size:13px;color:var(--p-mute)}
.price{font-weight:800;color:var(--q-blue)}
.p-btn{min-height:50px;border:0;border-radius:14px;padding:0 18px;background:var(--p-ink);color:#fff;font-weight:700;font-size:15.5px}
.p-btn.blue{background:var(--q-blue)}
.p-btn.ghost{background:#F1F3F7;color:var(--p-ink)}
.p-note{font-size:12.5px;color:var(--p-mute)}

/* quant world */
.quant{background:#0A2CB8;color:#fff;min-height:100vh;background-image:linear-gradient(rgba(255,255,255,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.08) 1px,transparent 1px);background-size:26px 26px}
.quant .bar,.reason .bar{background:rgba(5,16,80,.85);border-bottom-color:rgba(255,255,255,.15)}
.quant .crumbs button,.reason .crumbs button{border-color:rgba(255,255,255,.25);color:#CFE0FF}
.quant .crumbs button[aria-current="page"],.reason .crumbs button[aria-current="page"]{background:#fff;color:#0A2CB8;border-color:#fff}
.stage{position:relative;border-radius:22px;overflow:hidden;background:#06155E;border:1px solid rgba(255,255,255,.18);aspect-ratio:16/10;max-width:100%}
.cam{position:absolute;inset:0;transition:transform .9s cubic-bezier(.2,.8,.2,1);transform-origin:70% 45%}
.cam.zoom-screen{transform:scale(1.55) translate(-12%,4%)}
.cam.zoom-guy{transform:scale(1.5) translate(22%,-2%);transform-origin:20% 55%}
@media (prefers-reduced-motion:reduce){.cam{transition:none}}
.floor{position:absolute;left:0;right:0;bottom:0;height:24%;background:linear-gradient(180deg,#0B1F8E,#071457)}
.guy{position:absolute;left:4%;bottom:6%;width:26%}
.tv{position:absolute;right:5%;top:12%;width:62%;aspect-ratio:16/10;background:#0B0D12;border-radius:14px;border:6px solid #1B2238;box-shadow:0 20px 50px rgba(0,0,0,.45)}
.tv::after{content:"";position:absolute;left:46%;bottom:-22px;width:8%;height:16px;background:#1B2238;border-radius:0 0 4px 4px}
.screen{position:absolute;inset:0;border-radius:8px;overflow:hidden;background:linear-gradient(160deg,#0F3BFF,#0A1F99);display:flex;flex-direction:column;justify-content:center;padding:6% 7%;gap:6px;font-family:var(--inter)}
.screen .k{font-size:clamp(9px,1.6vw,12px);letter-spacing:.12em;text-transform:uppercase;color:#9CC8FF;font-weight:700}
.screen .big{font-size:clamp(15px,3.3vw,28px);font-weight:800;line-height:1.1}
.screen .eq{font-family:var(--mono);font-size:clamp(12px,2.6vw,22px);color:#fff;background:rgba(255,255,255,.1);padding:4px 8px;border-radius:6px;align-self:flex-start}
.screen .hl{color:#FFE27A}
.subs{position:absolute;left:4%;right:4%;bottom:3%;font-size:clamp(11px,2vw,14px);background:rgba(0,0,0,.55);padding:6px 10px;border-radius:8px;text-align:center}
.player-ctl{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.qbtn{min-height:44px;padding:0 14px;border-radius:12px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:#fff;font-weight:700}
.qbtn.on{background:#fff;color:#0A2CB8}
.qcard{background:#fff;color:var(--p-ink);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:10px}
.qopt{min-height:52px;border-radius:14px;border:1.5px solid var(--p-line);background:#fff;text-align:left;padding:0 14px;font-weight:600;color:var(--p-ink)}
.qopt.right{border-color:#0B9B55;background:#E8F8EF}
.qopt.wrong{border-color:#D23B3B;background:#FDEBEB}
.mentor{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:10px}
.bub{max-width:85%;padding:10px 12px;border-radius:14px;font-size:14.5px;line-height:1.45}
.bub.gg{background:#fff;color:var(--p-ink);align-self:flex-start}
.bub.me{background:#FFE27A;color:#1A1500;align-self:flex-end;font-weight:600}
.chaps{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.chap{flex:none;min-height:40px;padding:0 12px;border-radius:999px;border:1px solid rgba(255,255,255,.3);background:transparent;color:#fff;font-size:13.5px;font-weight:600}
.chap.on{background:#fff;color:#0A2CB8}

/* verbal world */
.verbal{background:#FAFAF7;color:#16171A;min-height:100vh}
.verbal .bar{background:rgba(250,250,247,.94);border-bottom-color:#E7E5DE}
.verbal .logo{color:#16171A} .verbal .logo b{color:#16171A} .verbal .logo .cur{background:#16171A}
.verbal .chipbtn{background:#fff;border-color:#E7E5DE;color:#16171A}
.verbal .crumbs button{border-color:#E7E5DE;color:#6A6A6A}
.verbal .crumbs button[aria-current="page"]{background:#16171A;color:#fff;border-color:#16171A}
.modes{display:inline-flex;gap:4px;padding:4px;border-radius:12px;background:#EFEDE6}
.modes button{min-height:42px;padding:0 14px;border:0;border-radius:9px;background:transparent;font-weight:600;color:#55534D;font-size:14px}
.modes button[aria-pressed="true"]{background:#fff;color:#16171A;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.article{font-family:var(--serif);font-size:19px;line-height:1.7;color:#1C1C1C;max-width:62ch}
.article p+p{margin-top:16px}
.article h2{font-family:var(--serif);font-size:30px;line-height:1.15;margin-bottom:10px}
.kicker{font-family:var(--inter);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#8A6A1A;font-weight:700}

/* reasoning world */
.reason{color:#fff;min-height:100vh;background:radial-gradient(120% 90% at 70% -10%,#4A25C9 0%,#1A0E52 45%,#090522 100%)}
#sky{position:fixed;inset:0;z-index:0;pointer-events:none}
.reason main{position:relative;z-index:1}
.table-scene{position:relative;width:100%;max-width:520px;aspect-ratio:1;margin:0 auto}
.rtable{position:absolute;inset:26%;border-radius:50%;background:radial-gradient(circle at 40% 35%,#8C6BFF,#3B1FA6 60%,#1D0E62);box-shadow:0 0 60px rgba(124,92,255,.6),inset 0 0 40px rgba(255,255,255,.15)}
.seat{position:absolute;width:17%;aspect-ratio:1;margin:-8.5% 0 0 -8.5%;border-radius:50%;display:grid;place-items:center;font-family:var(--hudf);font-weight:700;font-size:clamp(16px,4vw,24px);border:2px dashed rgba(255,255,255,.35);color:rgba(255,255,255,.5);transition:all .6s cubic-bezier(.2,.8,.2,1)}
.seat.filled{border-style:solid;color:#120830;background:var(--r-gold);border-color:#fff;box-shadow:0 0 24px rgba(255,211,106,.7)}
.seat.glow{box-shadow:0 0 30px 8px rgba(255,95,184,.8)}
.clue{display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:14px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);font-size:15px}
.clue.done{background:rgba(255,211,106,.14);border-color:rgba(255,211,106,.5)}
.clue .n{font-family:var(--hudf);font-weight:700;color:var(--r-gold);min-width:22px}

/* ---------- GoodHabit ---------- */
.habit{background:var(--g-bg);color:var(--g-ink);font-family:var(--gh-b);min-height:100vh}
.habit .bar{background:rgba(246,247,252,.95);border-bottom-color:var(--g-line)}
.habit .logo{color:var(--g-ink);font-family:var(--gh-d);font-size:20px;letter-spacing:-.01em} .habit .logo b{color:var(--g-accent)} .habit .logo .cur{display:none}
.habit .chipbtn{background:#fff;border-color:var(--g-line);color:var(--g-ink);font-family:var(--gh-b)}
.htabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:4px;background:#E9ECF6;border-radius:14px;margin:12px 0}
.htabs button{min-height:44px;border:0;border-radius:10px;background:transparent;font-weight:800;color:var(--g-mute)}
.htabs button[aria-current="page"]{background:#fff;color:var(--g-ink);box-shadow:0 1px 4px rgba(18,22,51,.1)}
.reel{border-radius:22px;aspect-ratio:9/13;position:relative;overflow:hidden;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:18px;gap:6px}
.reel .src{position:absolute;top:14px;left:14px;font-size:12px;font-weight:800;background:rgba(0,0,0,.4);padding:4px 9px;border-radius:999px}
.reel h3{font-family:var(--gh-d);font-size:clamp(24px,6vw,32px);line-height:1.05}
.reel .acts{position:absolute;right:12px;bottom:90px;display:flex;flex-direction:column;gap:10px}
.reel .acts button{width:48px;height:48px;border-radius:50%;border:0;background:rgba(0,0,0,.35);color:#fff;font-size:12px;font-weight:800}
.person{display:flex;gap:12px;align-items:center;width:100%;min-height:68px;padding:10px 4px;border:0;border-bottom:1px solid var(--g-line);background:transparent;text-align:left;color:var(--g-ink)}
.av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;flex:none}
.pill{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:800}
.pill.up{background:#DDF3E8;color:var(--g-up)} .pill.down{background:#FCE3E5;color:var(--g-down)} .pill.mute{background:#EEF0F8;color:var(--g-mute)} .pill.acc{background:var(--g-wash);color:var(--g-accent)}
.chat{display:flex;flex-direction:column;gap:8px;padding:12px 0 90px}
.msg{max-width:80%;padding:10px 12px;border-radius:16px;font-size:15px;line-height:1.4}
.msg.them{background:#fff;border:1px solid var(--g-line);align-self:flex-start}
.msg.me{background:var(--g-accent);color:#fff;align-self:flex-end}
.msg.hissab{align-self:center;max-width:92%;background:#FFF8E6;border:1px solid #F1D48A;color:#5A3E00;text-align:center;font-weight:700}
.hbar{position:sticky;top:calc(58px + env(safe-area-inset-top,0px));z-index:5;display:flex;align-items:center;gap:10px;justify-content:space-between;background:#fff;border:1px solid var(--g-line);border-radius:14px;padding:10px 12px;margin-top:10px}
.composer{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--g-line);padding:10px max(12px,env(safe-area-inset-left,0px)) calc(10px + env(safe-area-inset-bottom,0px))}
.composer .in{max-width:620px;margin:0 auto;display:flex;gap:8px}
.composer input{flex:1;min-height:46px;border-radius:12px;border:1px solid var(--g-line);padding:0 12px;font:inherit}
.gbtn{min-height:46px;padding:0 14px;border-radius:12px;border:0;background:var(--g-accent);color:#fff;font-weight:800}
.gbtn.ghost{background:#EEF0F8;color:var(--g-ink)}
.gbtn.pink{background:var(--g-pink)}
.gcard{background:#fff;border:1px solid var(--g-line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}
.trial{background:linear-gradient(135deg,var(--g-accent),#5B25D9);color:#fff;border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:6px}
.seg2{display:flex;flex-wrap:wrap;gap:6px}
.seg2 button{min-height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--g-line);background:#fff;font-weight:800;color:var(--g-mute)}
.seg2 button[aria-pressed="true"]{background:var(--g-ink);color:#fff;border-color:var(--g-ink)}
.story{background:#121633;color:#fff;border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:10px}
.story .date{font-family:var(--mono);font-size:13px;color:#FFD36A;font-weight:700}
.story h3{font-family:var(--gh-d);font-size:24px;line-height:1.15}
.story .choice{min-height:54px;border-radius:14px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;text-align:left;padding:10px 14px;font-weight:700}
.story .choice.pri{background:#fff;color:#121633;border-color:#fff}

/* worlds: portal, landing pages, world bars */
.portal{position:fixed;inset:0;z-index:95;display:grid;place-items:center;font-family:var(--hudf);font-weight:700;font-size:clamp(22px,5vw,40px);letter-spacing:.12em;text-transform:uppercase;color:#fff;clip-path:circle(0% at var(--px,50%) var(--py,50%));animation:portal .65s cubic-bezier(.7,0,.3,1) forwards}
@keyframes portal{to{clip-path:circle(150% at var(--px,50%) var(--py,50%))}}
@media (prefers-reduced-motion:reduce){.portal{animation:none;clip-path:none}}
.land-hero{position:relative;min-height:min(78vh,640px);display:flex;align-items:flex-end;overflow:hidden;border-bottom:1px solid var(--steel)}
.land-hero .inner{position:relative;z-index:1;padding-block:40px 34px;display:flex;flex-direction:column;gap:12px;width:100%}
.land-hero h1{font-family:var(--hudf);font-weight:700;font-size:clamp(48px,11vw,110px);line-height:.9;text-transform:uppercase;color:#fff}
.land-hero .lede{color:#E8E6DE;font-size:18px;max-width:58ch}
.tagrow{display:flex;flex-wrap:wrap;gap:6px}
.tagrow span{font-family:var(--mono);font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:3px;background:rgba(0,0,0,.55);color:var(--hud);letter-spacing:.06em}
.land-art{position:absolute;right:4%;bottom:6%;width:min(34vw,260px)}
.land-ledger{position:absolute;right:5%;top:12%;width:min(38vw,300px)}
@media (max-width:700px){.land-art{bottom:auto;top:6%;width:30vw}.land-ledger{top:5%;width:62vw;opacity:.55!important}}
.scrollcue{font-family:var(--mono);font-size:12.5px;color:#E8E6DE;opacity:.85}
.gate{margin-block:34px 70px;border:1px solid var(--hud-dim);border-radius:6px;padding:clamp(22px,5vw,46px);display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;background:radial-gradient(70% 120% at 50% 0%,rgba(255,178,26,.14),transparent 70%),var(--ink-2)}
.gate h2{font-family:var(--hudf);font-weight:700;font-size:clamp(26px,5vw,44px);text-transform:uppercase;letter-spacing:.04em}
.gate p{color:var(--ash);max-width:52ch}
.gate .btn-hud{min-height:58px;font-size:18px;padding:0 28px}
.exitbtn{flex:none;min-height:40px;padding:0 12px;border-radius:999px;font-size:13px;font-weight:700;border:1px solid currentColor;background:transparent;opacity:.85}
.wtabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:0 28px 10px 0;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 40px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 40px),transparent)}
@media(min-width:760px){.wtabs{-webkit-mask-image:none;mask-image:none;padding-right:0}}
.osename{white-space:nowrap}
@media(max-width:400px){.osename{font-size:16px}}
.hint{color:var(--ash);font-size:14px}
.myapps{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:14px 10px;margin-top:4px}
.appicon{display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:none;padding:4px;min-height:44px;color:inherit}
.appicon .art,.approw .art{display:grid;place-items:center;overflow:hidden;flex:none}
.appicon b{font-size:13px;font-weight:700;text-align:center;line-height:1.2}
.applist{display:flex;flex-direction:column}
.approw{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--steel);flex-wrap:wrap}
.appmeta{display:flex;align-items:center;gap:14px;flex:1 1 260px;min-width:0;border:0;background:none;padding:0;text-align:left;color:var(--bone);min-height:56px}
.appmeta b{display:block;font-family:var(--hudf);font-size:18px;font-weight:800;color:#111}
.appmeta span span{font-size:13.5px;color:var(--ash)}
.appmeta .soon{font-size:12px;font-weight:700;color:var(--ash);border:1px solid var(--steel);border-radius:999px;padding:2px 8px;margin-left:6px}
.appbtns{display:flex;gap:8px;margin-left:auto}
.openbtn,.pinbtn{min-height:40px;padding:0 14px;border-radius:999px;font-weight:700;font-size:14px;border:1px solid var(--steel);background:#fff;color:#111}
.openbtn{background:#111;color:#fff;border-color:#111}
.pinbtn[aria-pressed="true"]{background:#E8F5EC;border-color:#0B7A3B;color:#0B7A3B}
.listing-acts{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin-top:12px}
.land-hero .pinbtn{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.4)}
.land-hero .pinbtn[aria-pressed="true"]{background:#fff;color:#0B7A3B;border-color:#fff}
.subs{position:static!important;margin-top:8px;font-size:14px!important;line-height:1.45}
@media(max-width:560px){.stage{aspect-ratio:4/3!important}.tv{width:70%!important;top:8%!important}.guy{width:30%!important}}
.wtabs button{flex:none;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--p-line);background:#fff;color:var(--p-mute);font-weight:700;font-size:14px}
.wtabs button[aria-current="page"]{background:var(--p-ink);color:#fff;border-color:var(--p-ink)}
.quant .wtabs button,.reason .wtabs button{background:transparent;border-color:rgba(255,255,255,.3);color:#E0E8FF}
.quant .wtabs button[aria-current="page"],.reason .wtabs button[aria-current="page"]{background:#fff;color:#0A2CB8;border-color:#fff}
.verbal .wtabs button{border-color:#E7E5DE;background:#fff;color:#6A6A6A}
.verbal .wtabs button[aria-current="page"]{background:#16171A;color:#fff;border-color:#16171A}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--g-line);padding:6px max(8px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px))}
.tabbar .in{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.tabbar button{min-height:52px;border:0;border-radius:12px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:800;font-size:12.5px;color:var(--g-mute)}
.tabbar button .i{font-size:18px;line-height:1}
.tabbar button[aria-current="page"]{color:var(--g-ink);background:var(--g-wash)}
.amt{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:700}
.ledger-sum{background:var(--g-ink);color:#F4F3EE;border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:6px}
.ledger-sum .big{font-family:var(--mono);font-size:32px;font-weight:700}
.accts{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.acct{flex:none;min-width:130px;border:1px solid var(--g-line);background:#fff;border-radius:14px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:2px;color:var(--g-ink)}
.acct span{font-size:12.5px;color:var(--g-mute)}
.entry{display:flex;gap:10px;align-items:center;width:100%;min-height:62px;padding:8px 2px;border:0;border-bottom:1px solid var(--g-line);background:transparent;text-align:left;color:var(--g-ink)}
.entry .dot{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:15px;flex:none}
.entry .dot.in{background:#DDF1E4;color:var(--g-up)} .entry .dot.out{background:#F7E1DF;color:var(--g-down)}
.daylabel{font-family:var(--mono);font-size:12px;color:var(--g-mute);letter-spacing:.06em;margin-top:14px}

/* India Money: boring on purpose */
.money{background:var(--m-bg);color:var(--m-ink);font-family:var(--mono);font-size:13.5px;min-height:100vh}
.money .bar{background:#DADADA;border-bottom-color:var(--m-line)}
.money .logo{color:var(--m-ink)} .money .logo b{color:var(--m-ink)} .money .logo .cur{background:var(--m-ink)}
.money .chipbtn{background:#fff;border-color:var(--m-line);color:var(--m-ink)}
.mgrid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:10px}
@media (max-width:760px){.mgrid{grid-template-columns:1fr}}
.mpanel{min-width:0;background:var(--m-panel);border:1px solid var(--m-line);padding:10px;display:flex;flex-direction:column;gap:8px}
.mpanel h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--m-mute);font-family:var(--mono)}
.mtable{width:100%;border-collapse:collapse}
.mtable th,.mtable td{border-bottom:1px solid #E3E3E3;padding:7px 6px;text-align:left;font-size:13px}
.mtable td.n,.mtable th.n{text-align:right}
.mbtn{min-height:40px;padding:0 10px;border:1px solid #9A9A9A;background:#F4F4F4;color:var(--m-ink);font-family:var(--mono);font-size:12.5px;font-weight:700;border-radius:2px}
.mbtn.go{background:#1D1D1D;color:#fff;border-color:#1D1D1D}
.ggnote{display:flex;gap:10px;align-items:flex-start;background:#FFFBEA;border:1px solid #E9D488;padding:10px;font-family:var(--inter);font-size:14px;color:#3D3200}

/* ---------- skills + library (shell world) ---------- */
.skill{display:flex;gap:12px;align-items:center;border:1px solid var(--steel);border-radius:4px;background:var(--ink-2);padding:12px}
.skill .ic{width:44px;height:44px;border-radius:4px;display:grid;place-items:center;font-family:var(--mono);font-weight:700;font-size:12px;flex:none;background:var(--ink-3);color:var(--hud);border:1px solid var(--steel)}
.skill b{display:block;font-family:var(--hudf);font-size:16px;letter-spacing:.03em}
.skill span{font-size:13px;color:var(--ash)}
.badge{font-family:var(--mono);font-size:11px;font-weight:700;padding:3px 7px;border-radius:3px;border:1px solid var(--steel);color:var(--ash);white-space:nowrap}
.badge.free{color:var(--ok);border-color:#2C5A3E} .badge.paid{color:var(--hud);border-color:var(--hud-dim)}
.src-row{border:1px solid var(--steel);border-radius:4px;background:var(--ink-2);padding:12px;display:flex;flex-direction:column;gap:6px}
.stars{color:var(--hud);letter-spacing:2px}
.search{display:flex;gap:8px}
.search input{flex:1;min-height:50px;border-radius:4px;border:1px solid var(--steel);background:var(--ink-2);color:var(--bone);padding:0 14px;font-family:var(--mono);font-size:14px}

/* ---------- redesign: friendly and for everyone (overrides the shell styles above) ---------- */
:root{color-scheme:light;
  --ink:#F6F5F1; --ink-2:#FFFFFF; --ink-3:#F1EFEA; --steel:#E5E2DA; --hud:#FFC93C; --hud-dim:#F0D98C; --bone:#15161A; --ash:#5E6370; --ok:#0B8A4B; --warn:#D9480F; --brand:#2448FF;
  --mono:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif; --hudf:"Bricolage Grotesque", system-ui, sans-serif;}
body{background:var(--ink);color:var(--bone)}
body::before{background:var(--ink)}
.home{background:var(--ink)}
.bar{background:rgba(246,245,241,.92);border-bottom-color:var(--steel)}
.logo{font-family:var(--hudf);font-size:19px;font-weight:800;letter-spacing:-.01em;color:var(--bone)}
.logo b{color:inherit} .logo .cur{display:none}
.logo .mark{width:30px;flex:none;display:block}
.chipbtn{background:#fff;border-color:var(--steel);color:var(--bone);font-family:var(--inter);font-size:14px;font-weight:600;border-radius:999px}
.chipbtn.hot{background:var(--bone);border-color:var(--bone);color:#fff}
.crumbs button{font-family:var(--inter);font-size:14px;font-weight:600;color:var(--ash);border-color:var(--steel);background:#fff}
.crumbs button[aria-current="page"]{background:var(--bone);border-color:var(--bone);color:#fff}
.hero h1{font-family:var(--hudf);text-transform:none;font-weight:800;letter-spacing:-.035em;line-height:.98;font-size:clamp(42px,7.4vw,80px)}
.hero h1 em{color:var(--brand);background:linear-gradient(transparent 70%,rgba(255,201,60,.55) 70%)}
.hero .lede{color:var(--ash);font-size:18px}
.btn-hud{clip-path:none;border-radius:999px;background:var(--bone);color:#fff;font-family:var(--inter);font-weight:700;text-transform:none;letter-spacing:0;font-size:16px;padding:0 22px}
.btn-line{border-radius:999px;background:#fff;border-color:var(--steel);color:var(--bone);font-family:var(--inter);text-transform:none;letter-spacing:0;font-weight:700;font-size:16px}
.stat{background:#fff;border-radius:20px;border-color:var(--steel)} .stat::before{display:none}
.stat .v{font-family:var(--hudf);font-weight:800;color:var(--bone)} .stat .l{font-family:var(--inter);text-transform:none;letter-spacing:0;font-size:13.5px;color:var(--ash)}
.sect-h{border-bottom:0;padding-bottom:0} .sect-h h2{font-family:var(--hudf);text-transform:none;letter-spacing:-.02em;font-size:28px;font-weight:800} .sect-h span{font-family:var(--inter);font-size:14px;color:var(--ash)}
.tile{border-radius:24px;border:0;background:#fff;box-shadow:0 1px 2px rgba(20,20,30,.06),0 10px 30px rgba(20,20,30,.07)}
.tile:hover{border-color:transparent;transform:translateY(-3px);box-shadow:0 2px 4px rgba(20,20,30,.08),0 18px 40px rgba(20,20,30,.12)}
.cover .tag{font-family:var(--inter);text-transform:none;letter-spacing:0;background:rgba(255,255,255,.94);color:var(--bone);border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:700}
.cover .tag.free{color:var(--ok)}
.cover .tag{z-index:2}
.cover-title{font-family:var(--hudf);text-transform:none;font-weight:800;letter-spacing:-.02em;font-size:32px}
.cover .lock{background:rgba(246,245,241,.86);color:var(--bone);font-family:var(--inter);font-size:14px;font-weight:600}
.meta{border-top:0;padding:14px 16px 16px} .meta b{font-family:var(--inter);text-transform:none;letter-spacing:0;font-size:16.5px;font-weight:800} .meta span{color:var(--ash)}
.whycard{border-radius:22px;background:#fff;border-color:var(--steel);padding:18px}
.whycard .k{font-family:var(--inter);letter-spacing:0;color:var(--brand);font-weight:700;font-size:13.5px}
.whycard h3{font-family:var(--hudf);text-transform:none;letter-spacing:-.01em;font-size:21px;font-weight:800}
.whycard p{color:var(--ash)}
.idcard{background:#fff;border-color:var(--steel);border-radius:24px}
.vb{font-family:var(--inter);border-radius:999px;font-size:12.5px;font-weight:600} .vb.v{background:#E7F6EE;border-color:#BFE6CF;color:var(--ok)}
.foot{font-family:var(--inter);font-size:13px}
.sheet.dark{background:#fff;color:var(--bone);border:0}
.sheet.dark .opt{background:#fff;border-color:#E3E5EA;color:var(--bone)}
.sheet.dark select,.sheet.dark .inp{background:#fff;border-color:#D8DBE2;color:#111}
.skill{border-radius:20px;background:#fff;border-color:var(--steel);padding:14px}
.skill .ic{border-radius:14px;background:#FFF3CC;color:var(--bone);border:0;font-family:var(--inter);font-weight:800}

<div id="layer"></div>
<div id="toastslot" aria-live="polite"></div>

<script>
(function(){
const $ = s => document.querySelector(s);
const app = $('#app'), layer = $('#layer');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inr = n => (n < 0 ? '−' : '') + '₹' + Math.abs(Math.round(n)).toLocaleString('en-IN');
let toastT; function toast(m){ $('#toastslot').innerHTML = `<div class="toast" role="status">${esc(m)}</div>`; clearTimeout(toastT); toastT = setTimeout(() => $('#toastslot').innerHTML = '', 2600); }
function sheet(html, dark){ layer.innerHTML = `<div class="scrim" data-act="scrim"><div class="sheet ${dark?'dark':''}" role="dialog" aria-modal="true" data-stop><button class="x" data-act="close">Close ✕</button>${html}</div></div>`; const f = layer.querySelector('input,select,button:not(.x)'); f && f.focus({preventScroll:true}); }
function closeSheet(){ layer.innerHTML = ''; }
let timers = []; function clearTimers(){ timers.forEach(t => { clearInterval(t); clearTimeout(t); }); timers = []; }

/* GoodGuy, the mascot: drawn in SVG so he can appear anywhere */
function goodguy(mood='happy', tint='#2F6BFF'){
  const mouth = mood === 'talk' ? '<ellipse cx="60" cy="66" rx="9" ry="6" fill="#1A1A2E"/>' : mood === 'think' ? '<path d="M50 67 h20" stroke="#1A1A2E" stroke-width="4" stroke-linecap="round"/>' : '<path d="M47 63 q13 12 26 0" stroke="#1A1A2E" stroke-width="4" fill="none" stroke-linecap="round"/>';
  return `<svg viewBox="0 0 120 150" role="img" aria-label="GoodGuy, the mascot">
    <line x1="60" y1="6" x2="60" y2="20" stroke="${tint}" stroke-width="4" stroke-linecap="round"/><circle cx="60" cy="6" r="5" fill="#FFD36A"/>
    <rect x="34" y="92" width="52" height="46" rx="18" fill="${tint}"/>
    <circle cx="60" cy="116" r="11" fill="#fff"/><text x="60" y="121" text-anchor="middle" font-family="Chakra Petch, sans-serif" font-weight="700" font-size="14" fill="${tint}">G</text>
    <path d="M36 102 q-14 10 -10 26" stroke="${tint}" stroke-width="9" fill="none" stroke-linecap="round"/>
    <path d="M84 102 q16 -6 20 -22" stroke="${tint}" stroke-width="9" fill="none" stroke-linecap="round"/>
    <circle cx="60" cy="56" r="40" fill="${tint}"/><ellipse cx="60" cy="60" rx="31" ry="27" fill="#fff"/>
    <ellipse cx="48" cy="54" rx="6" ry="8" fill="#1A1A2E"/><ellipse cx="72" cy="54" rx="6" ry="8" fill="#1A1A2E"/>
    <circle cx="50" cy="51" r="2" fill="#fff"/><circle cx="74" cy="51" r="2" fill="#fff"/>${mouth}</svg>`;
}

/* ---------------- state ---------------- */
const S = {
  user:null, // OpenID once signed in
  free:{reels:10, long:1, mentor:10},
  hissab:{
    kabir:{name:'Kabir Shah', id:'good/kabir', bg:'#06683F', state:'connected', bal:45000, msgs:[['them','Goa photos are up!'],['hissab','Hissab · Dinner at Thalassa ₹1,800 · you paid · split 2 ways → Kabir owes you ₹900'],['me','Sending the cab money tonight?'],['hissab','Hissab · Cab ₹900 · Kabir paid · split 2 ways → you owe Kabir ₹450']]},
    ananya:{name:'Riya Mehta', id:'good/riya', bg:'#B5134F', state:'invite-in', bal:0, msgs:[['them','Started a Hissab with you for the Jaipur trip?']]},
    zoya:{name:'Zoya Khan', id:'good/zoya', bg:'#0E6B63', state:'chat', bal:0, msgs:[['them','That percentages reel was so good, sending to my sister']]},
  },
  chatWith:null, habitTab:'reels',
  prep:{chap:0, step:0, playing:false, cam:'wide', answered:null, mentor:[], mode:'read', rstep:0, rAnswer:null},
  game:null,
};

/* ---------------- routing ---------------- */
const OSE = ['home','about','prep-about','habit-about','skills','library','community'], ALIAS = {cat:'prep-about', more:'home'}, PREPW = ['prep','quant','verbal','reason','mock'], HABITW = ['habit','markets','chats','reels','practice','money'];
const ROUTES = [...OSE, ...PREPW, ...HABITW];
function go(r){ location.hash = r; }
window.addEventListener('hashchange', render);

function signedChip(){ return S.user ? `<button class="chipbtn hot" data-act="me">${esc(S.user)}</button>` : `<button class="chipbtn hot" data-act="signin">Sign in<span class="wide-only"> · OpenID</span></button>`; }
function appsBtn(){ return `<button class="exitbtn" data-act="apps" aria-label="Your apps"><svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor" aria-hidden="true" style="vertical-align:-2px;margin-right:5px"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>Apps</button>`; }
function bar(world){
  if (PREPW.includes(world)) {
    const tabs = [['prep','Home'],['quant','Quant'],['verbal','Verbal'],['reason','Reasoning'],['mock','Free mock']];
    return `<header class="bar"><div class="col" style="display:flex;align-items:center;gap:10px;min-height:58px">
      <button class="logo" data-act="nav" data-r="prep" aria-label="OpenPrep home"><span class="mark" aria-hidden="true">${goodguy('happy','#3FA9FF')}</span><span>OpenPrep</span></button>${appsBtn()}</div>
      <div class="col"><nav class="wtabs" aria-label="OpenPrep">${tabs.map(([r,l]) => `<button data-act="nav" data-r="${r}" ${r===world?'aria-current="page"':''}>${l}</button>`).join('')}</nav></div></header>`;
  }
  if (HABITW.includes(world)) {
    return `<header class="bar"><div class="col" style="display:flex;align-items:center;gap:10px;min-height:58px">
      <button class="logo" data-act="nav" data-r="practice" aria-label="GoodHabit home"><span>GoodHabit${world==='money'?' · practice':''}</span></button>${appsBtn()}</div></header>`;
  }
  const crumbs = [['home','All apps'],['prep-about','OpenPrep'],['habit-about','GoodHabit'],['skills','The Good Stuff'],['library','AI Library'],['community','Community'],['about','About us']];
  return `<header class="bar"><div class="wrap" style="display:flex;align-items:center;gap:10px;min-height:58px">
    <button class="logo" data-act="nav" data-r="home" aria-label="OpenSource Everything, all apps"><span class="mark" aria-hidden="true">${goodguy('happy','#2448FF')}</span><span class="osename">OpenSource Everything</span></button>

    <div class="wrap"><nav class="wtabs" aria-label="OpenSource Everything">${crumbs.map(([r,l]) => `<button data-act="nav" data-r="${r}" ${r===world?'aria-current="page"':''}>${l}</button>`).join('')}</nav></div></header>`;
}
function icon(n){ const P = {wallet:'<rect x="3" y="6" width="18" height="13" rx="3"/><path d="M16 12.5h2"/><path d="M5 6l10-3 1 3"/>', chart:'<path d="M3 17l5-6 4 3 6-8"/><path d="M3 21h18"/>', chat:'<path d="M4 5h16v11H9l-5 4z"/>', play:'<rect x="4" y="3" width="16" height="18" rx="3"/><path d="M10 9l5 3-5 3z" fill="currentColor"/>', target:'<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.5"/>', lock:'<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>'}; return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]}</svg>`; }
function tabbar(world){
  if (!HABITW.includes(world) || world === 'money' || (world === 'chats' && S.chatWith)) return '';
  const t = [['practice','target','Play'],['habit','wallet','Hissab'],['markets','chart','Markets'],['chats','chat','Chats'],['reels','play','Reels']];
  return `<nav class="tabbar" aria-label="GoodHabit"><div class="in">${t.map(([r,i,l]) => `<button data-act="nav" data-r="${r}" ${r===world?'aria-current="page"':''}>${icon(i)}${l}</button>`).join('')}</div></nav>`;
}
function render(){
  clearTimers(); closeSheet();
  let r = location.hash.slice(1); if (ALIAS[r]) { history.replaceState(null, '', '#' + ALIAS[r]); r = ALIAS[r]; } if (!ROUTES.includes(r)) r = 'home';
  document.body.className = OSE.includes(r) ? 'home' : HABITW.includes(r) ? (r === 'money' ? 'money' : 'habit') : r;
  $('#sky').hidden = r !== 'reason';
  const html = ({home:vHome,about:vAbout,'prep-about':vCat,'habit-about':vHabitAbout,mock:vMock,prep:vPrep,quant:vQuant,verbal:vVerbal,reason:vReason,habit:vHissab,markets:vMarkets,chats:vChats,reels:vReels,practice:vPractice,money:vMoney,skills:vSkills,library:vLibrary,community:vCommunity})[r]();
  app.innerHTML = bar(r) + html + tabbar(r);
  window.scrollTo(0,0);
  if (r === 'reason') startSky(); else stopSky();
  if (r === 'quant') drawLesson();
}

function tile(kind, title, tag, name, desc, opts={}){
  return `<button class="tile ${opts.big?'big':''}" ${opts.locked?'aria-disabled="true"':''} data-act="${opts.locked?'locked':'nav'}" data-r="${opts.r||''}" data-why="${esc(opts.why||'')}">
    <div class="cover" style="${cover(kind)}">${opts.art||''}<span class="tag ${tag==='FREE'?'free':''}">${tag}</span><span class="cover-title" ${opts.locked?'style="color:#15161A;text-shadow:none;opacity:.35"':''}>${title}</span>${opts.locked?`<span class="lock">🔒 ${esc(opts.locked)}</span>`:''}</div>
    <div class="meta"><b>${name}</b><span>${desc}</span></div></button>`;
}
const APPS = [
  {k:'prep', n:'OpenPrep', d:'Free CAT prep: lessons, unlimited practice, a full mock every month', open:'prep', page:'prep-about', bg:'linear-gradient(135deg,#1B4DFF,#06115A)'},
  {k:'habit', n:'GoodHabit', d:'The money game, Hissab with friends and your own books', open:'practice', page:'habit-about', bg:'linear-gradient(135deg,#2448FF,#121633)'},

const appOf = k => APPS.find(a => a.k === k);
function appArt(a, size){ const inner = a.k === 'prep' ? `<span style="width:78%;display:block">${goodguy('happy','#3FA9FF')}</span>` : (ART[a.k] || ART.acct).replace('class="art"', `width="${Math.round(size*.9)}" height="${Math.round(size*.8)}"`); return `<span class="art" style="width:${size}px;height:${size}px;border-radius:${Math.round(size*.28)}px;background:${a.bg}">${inner}</span>`; }
function myApps(){
  const pins = S.pins.map(appOf).filter(Boolean);
  if (!pins.length) return `<p class="hint">Pin the apps you use. Each one then opens on its own, like a separate app on your phone.</p>`;
  return `<div class="myapps">${pins.map(a => `<button class="appicon" data-act="nav" data-r="${a.open}">${appArt(a,64)}<b>${a.n}</b></button>`).join('')}</div>`;
}
function pinBtn(a){ const on = S.pins.includes(a.k); return `<button class="pinbtn" data-act="pinapp" data-k="${a.k}" aria-pressed="${on}">${on ? '✓ In my apps' : '＋ My apps'}</button>`; }
function siteFoot(){ return `<footer class="sitefoot"><span>OpenSource Everything · ad-free, open, for everyone</span><button data-act="nav" data-r="about">About us</button><button data-act="aboutnum">Open numbers</button><button data-act="nav" data-r="about">One ID for everything</button><span>Clickable preview with sample data.</span></footer>`; }

  <section class="plain"><div class="sect-h"><h2>All apps</h2><span>everything we make, in one place</span></div>
    <div class="applist">${APPS.map(a => `<div class="approw"><button class="appmeta" ${a.soon ? 'data-act="locked" data-why="AccountingUnlocked"' : `data-act="nav" data-r="${a.page}"`}>${appArt(a,56)}<span style="flex:1;min-width:0"><b>${a.n}${a.soon ? '<span class="soon">Soon</span>' : ''}</b><span>${a.d}</span></span></button>${a.soon ? '' : `<span class="appbtns"><button class="openbtn" data-act="nav" data-r="${a.open}">Open</button>${pinBtn(a)}</span>`}</div>`).join('')}</div></section>

  </main>`;
}

const CLUES = [
  {t:'Six friends, A to F, sit around a round table facing the centre.', place:{}},
  {t:'A sits opposite D.', place:{A:0, D:3}},

function seatPos(i){ const a = -Math.PI/2 + i * Math.PI/3; return [50 + 39*Math.cos(a), 50 + 39*Math.sin(a)]; }
function vReason(){
  const st = S.prep.rstep, placed = {};

  return `<main class="col" style="padding-block:18px 60px;display:flex;flex-direction:column;gap:16px">
    <div><p style="color:#FFD36A;font-size:13px;font-weight:700;letter-spacing:.02em">Reasoning · seating arrangement</p><h1 style="font-size:30px;font-weight:800">Imagine the table</h1><p style="color:#D9CCFF">Tap through the clues. Watch each one land.</p><button class="qbtn" style="margin-top:8px" data-act="syllabus" data-s="reason">All 12 sets · 6 ready</button></div>
    <div class="table-scene" aria-label="Round table with six seats"><div class="rtable"></div>

    <div style="display:flex;flex-direction:column;gap:8px">${CLUES.map((c,i) => `<div class="clue ${i<=st?'done':''}"><span class="n">${i+1}</span><span>${i<=st?esc(c.t):'Next clue…'}</span></div>`).join('')}</div>
    ${checkedBy('#D9CCFF')}
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="qbtn" data-act="rstep" data-d="-1">← Back</button><button class="qbtn on" data-act="rstep" data-d="1" ${st>=CLUES.length-1?'disabled':''}>Next clue →</button></div>
    ${st>=CLUES.length-1?`<div class="qcard"><p style="font-size:18px;font-weight:700">Who sits opposite C?</p>${['A','B','E','F'].map((o,i) => `<button class="qopt ${ra==null?'':o==='B'?'right':i===ra?'wrong':''}" data-act="rans" data-i="${i}" ${ra!=null?'disabled':''}>${o}</button>`).join('')}${ra==null?'':`<p>${['A','B','E','F'][ra]==='B'?'Yes! C is in seat 5, B in seat 2: straight across.':'Look again: C is straight across from B.'} Flip the table in your head and it stays true, that's why it works.</p>`}</div>`:''}
  </main>`;
}
let skyRaf; function startSky(){ const c = $('#sky'), x = c.getContext('2d'); const stars = Array.from({length:120}, () => ({x:Math.random(), y:Math.random(), r:Math.random()*1.6+.3, s:Math.random()*.6+.2}));
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  function size(){ c.width = innerWidth * devicePixelRatio; c.height = innerHeight * devicePixelRatio; }
  size(); if (!startSky.bound) { addEventListener('resize', size); startSky.bound = true; }
  (function f(t){ x.clearRect(0,0,c.width,c.height); stars.forEach(s => { const tw = reduce ? .8 : .5 + .5*Math.sin(t/900*s.s + s.x*20); x.globalAlpha = tw; x.fillStyle = s.r > 1.5 ? '#FFD36A' : '#fff'; x.beginPath(); x.arc(s.x*c.width, s.y*c.height, s.r*devicePixelRatio, 0, 6.283); x.fill(); }); if (!reduce) skyRaf = requestAnimationFrame(f); })(0);

function series(sym, n, drift, vol){ let x = 0; for (const ch of sym) x = (x * 31 + ch.charCodeAt(0)) % 9973; const out = []; let v = 100; for (let i=0;i<n;i++){ x = (x * 9301 + 49297) % 233280; v *= 1 + (x/233280 - .5) * vol + drift/n; out.push(v); } return out; }
function spark(sym, up, w=76, h=30, n=40, ranged){ const d = series(sym + (ranged||''), n, up ? .02 : -.02, .035), mn = Math.min(...d), mx = Math.max(...d); const pts = d.map((v,i) => `${(i/(n-1)*w).toFixed(1)},${(h - (v-mn)/(mx-mn||1)*h).toFixed(1)}`).join(' '); return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none" aria-hidden="true"><polyline points="${pts}" fill="none" stroke="${up?'#30D158':'#FF453A'}" stroke-width="1.8" stroke-linejoin="round"/></svg>`; }
const fmt = v => v.toLocaleString('en-IN', {maximumFractionDigits:2});

        <div class="newsi" style="border-top:0"><b>Why did it move today? · GoodGuy</b><span style="color:#D1D1D6">Sample: ${esc(m[1])} ${up?'rose':'fell'} ${Math.abs(m[3]).toFixed(2)}% as ${up?'buyers reacted to strong quarterly numbers':'investors booked profits after a strong run'}. GoodGuy explains what happened, never what will happen next.</span></div>

  }

function hav(k){ const h = S.hissab[k]; return `<span class="av" style="background:${h.bg}" aria-hidden="true">${h.name.split(' ').map(w=>w[0]).join('')}</span>`; }
function balPill(h){ if (h.state !== 'connected') return h.state === 'invite-in' ? '<span class="pill acc">Hissab invite</span>' : h.state === 'invite-out' ? '<span class="pill mute">Invite sent</span>' : ''; return h.bal === 0 ? '<span class="pill mute">Settled</span>' : h.bal > 0 ? `<span class="pill up">owes you ${inr(h.bal/100)}</span>` : `<span class="pill down">you owe ${inr(-h.bal/100)}</span>`; }
function chatList(){

  <p style="color:var(--g-mute);font-size:13.5px;margin-top:12px">Hissab only works between people who both said yes. Nobody can add you without your OK.</p>`;

function chatView(k){

  if (c === 'tip'){ g.cash -= 200000; g.log.push(`${st.date}: put ₹2,000 in the tip. It fell 70% within months.`); g.cash += 60000; return nextStep(); }
  if (c === 'steady'){ g.log.push(`${st.date}: skipped the tip and invested ₹500 the boring way.`); return toMoney(50000); }
  if (c === 'bonusspend'){ g.log.push(`${st.date}: spent the whole ₹5,000 bonus.`); return nextStep(); }
  if (c === 'bonusinvest'){ g.cash += 250000; g.log.push(`${st.date}: invested half the bonus and enjoyed the rest.`); return toMoney(250000); }

    case 'sendinvite': { const v = ($('#hid').value || '').trim().toLowerCase(); if (!/^good\/[a-z0-9.]{2,}$/.test(v)) { toast('Use a Good ID like good/arjun'); break; } const k = v.replace('good/','').replace(/\W/g,''); S.hissab[k] = {name: k[0].toUpperCase()+k.slice(1), id:v, bg:'#4A3F8F', state:'invite-out', bal:0, msgs:[['hissab','Hissab invite sent. Waiting for them to accept.']]}; closeSheet(); render(); toast('Invite sent'); break; }
    case 'addhissab': sheet(`<h2>Add to Hissab</h2><div><label class="lbl" for="hw">What was it?</label><input class="inp" id="hw" placeholder="Chai, cab, movie"></div><div><label class="lbl" for="ha">Amount (₹)</label><input class="inp" id="ha" inputmode="decimal" placeholder="600"></div><div class="seg2" role="group" aria-label="Who paid"><button data-act="hpaid" data-p="me" aria-pressed="true">I paid</button><button data-act="hpaid" data-p="them" aria-pressed="false">They paid</button></div><p style="font-size:13.5px;color:#5D6488">Split equally between you two.</p><button class="gbtn" data-act="hsave" style="min-height:50px">Add</button>`); S.hpaid = 'me'; break;
    case 'hpaid': S.hpaid = b.dataset.p; b.parentElement.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b)); break;
    case 'hsave': { const amt = Math.round(parseFloat(String($('#ha').value).replace(/[,\s₹]/g,'')) * 100); if (!(amt > 0)) { toast('Type an amount like 600'); break; } const h = S.hissab[S.chatWith], what = $('#hw').value.trim() || 'Expense', half = Math.round(amt / 2), first = h.name.split(' ')[0]; h.bal += S.hpaid === 'me' ? half : -half; h.msgs.push(['hissab', `Hissab · ${what} ${inr(amt/100)} · ${S.hpaid==='me'?'you paid':first+' paid'} · split 2 ways → ${S.hpaid==='me'?`${first} owes you ${inr(half/100)}`:`you owe ${first} ${inr(half/100)}`}`]); closeSheet(); render(); break; }
    case 'settle': { const h = S.hissab[b.dataset.k]; if (!h.bal) { toast('Already settled'); break; } h.msgs.push(['hissab', `Settled ${inr(Math.abs(h.bal)/100)}. All square.`]); h.bal = 0; render(); toast('Marked as settled · UPI settle-up comes later'); break; }
    /* practice */
    case 'pmode': if (b.dataset.m === 'profile') profileSheet(); break;
    case 'pmapgo': pmap(); break;
    case 'pwho': S.game.who = b.dataset.k; render(); break;
    case 'pdiff': S.game.diff = b.dataset.k; render(); break;
    case 'pera': S.game.era = b.dataset.k; render(); break;
    case 'pstart': newGame(S.game.era); render(); break;
    case 'demo': S.game = S.game || {}; newGame(b.dataset.k); if (location.hash.slice(1) !== 'practice') go('practice'); else render(); break;
    case 'ch': choose(b.dataset.c); break;
    case 'quitgame': S.game = null; if (location.hash.slice(1) !== 'practice') go('practice'); else render(); break;
    case 'alloc': { const g = S.game, k = b.dataset.k, d = +b.dataset.d, left = g.pending - g.alloc.idx - g.alloc.gold - g.alloc.fd; if (d > 0 && left < d) { toast('Nothing left to place'); break; } g.alloc[k] = Math.max(0, g.alloc[k] + d); render(); break; }
    case 'placeorder': placeOrder(); break;
    /* skills, library, community */
    case 'sfilter': S.skillFilter = b.dataset.f; render(); break;
    case 'import': importSheet(b.dataset.n, b.dataset.t); S.importName = b.dataset.n; break;
    case 'pickai': b.parentElement.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b)); $('#paste').textContent = pasteText(S.importName, b.dataset.a); break;
    case 'copypaste': { const t = $('#paste').textContent; const done = () => toast('Copied. Paste it into your AI.'); try { navigator.clipboard.writeText(t).then(done, () => { selectPaste(); toast('Select and copy the message above'); }); } catch (err) { selectPaste(); toast('Select and copy the message above'); } break; }
    case 'buyskill': closeSheet(); toast(`${$('#ss') ? '' : ''}Pack ready for your market (preview, nothing charged)`); break;
    case 'github': S.gh = !S.gh; render(); toast(S.gh ? 'GitHub connected (preview)' : 'Disconnected'); break;
    case 'board': sheet(`<h2>CAT Quant board</h2><p style="color:var(--ash)">1,240 members (sample) · moderated · 18+</p>${['Shortcut for successive % changes?','DILR set 4 from yesterday: my approach','Daily 3-question streak thread'].map(t => `<div class="opt">${t}</div>`).join('')}`, true); break;
    case 'donate': sheet(`<h2>Support @creator (sample)</h2><p style="color:var(--ash)">Straight to the creator. We take ₹0.</p><div class="opt" style="justify-content:space-between"><span>₹100 by UPI</span><span>creator gets ₹97.64</span></div><div class="opt" style="justify-content:space-between"><span>Cover the fees</span><span>you pay ₹102.36</span></div><div class="opt">Solana · wallet verified · straight to the creator</div><p style="font-size:12.5px;color:var(--ash)">Payment fee about 2% plus GST on the fee passes through. Donations may be taxable for the creator.</p>`, true); break;
  }
});
function selectPaste(){ const el = $('#paste'); const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
function updateBeatLabel(){ const L = LESSONS[S.prep.chap], b = L.beats[S.prep.step], s = document.querySelector('.player-ctl span'); if (s) s.textContent = `Step ${S.prep.step+1} of ${L.beats.length}`; }
function togglePlay(){
  S.prep.playing = !S.prep.playing; $('#playbtn').textContent = S.prep.playing ? 'Pause' : '▶ Play lesson';
  clearTimers();
  if (S.prep.playing) {
    if (S.free.reels > 0 && S.prep.step === 0) S.free.reels--;
    const tick = () => { const L = LESSONS[S.prep.chap]; if (S.prep.step >= L.beats.length - 1) { S.prep.playing = false; const pb = $('#playbtn'); if (pb) pb.textContent = '↻ Replay'; S.prep.step = L.beats.length - 1; drawLesson(); return; } S.prep.step++; drawLesson(); updateBeatLabel(); };
    drawLesson(); timers.push(setInterval(tick, 3200));
  } else drawLesson();
}
document.addEventListener('input', e => {
  if (e.target.id === 'pdiff') { S.game.diff = ['easy','medium','hard'][+e.target.value]; const l = document.querySelector('label[for=pdiff]'); if (l) l.textContent = 'Difficulty: ' + S.game.diff[0].toUpperCase() + S.game.diff.slice(1); }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'cform') { const v = $('#cin').value.trim(); if (!v) return; S.hissab[S.chatWith].msgs.push(['me', v]); render(); $('#cin') && $('#cin').focus(); }
  if (e.target.id === 'libform') { S.libQ = $('#libq').value.trim(); render(); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && layer.innerHTML) closeSheet(); });


try { S.pins = JSON.parse(localStorage.getItem('ose-pins')) || []; S.start = localStorage.getItem('ose-start') || ''; } catch (e) { S.pins = []; S.start = ''; }
if (!Array.isArray(S.pins)) S.pins = [];
if (!location.hash && S.start && appOf(S.start)) history.replaceState(null, '', '#' + appOf(S.start).open);
render();
})();
</script>
