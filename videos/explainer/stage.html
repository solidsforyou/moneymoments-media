<!doctype html>
<html><head><meta charset="utf-8"><title>OSE explainer stage</title>
<style>
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html,body{width:1920px;height:1080px;overflow:hidden;background:#F2F2F7;font-family:"Inter",sans-serif;color:#0B0B0F;-webkit-font-smoothing:antialiased}
#left{position:absolute;left:150px;top:0;bottom:0;width:860px;display:flex;flex-direction:column;justify-content:center;gap:22px}
#chap{font-size:22px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#007AFF}
#title{font-family:"Inter Display","Inter",sans-serif;font-size:76px;line-height:1.04;font-weight:800;letter-spacing:-.03em}
#sub{font-size:31px;line-height:1.35;color:rgba(60,60,67,.7);max-width:760px}
#masc{display:flex;gap:18px;align-items:flex-end;min-height:150px}
#masc .m{width:140px;height:140px}
#masc .m svg{width:100%;height:100%}
#masc .n{display:flex;flex-direction:column;gap:2px;padding-bottom:14px}
#masc b{font-size:26px}#masc small{font-size:19px;color:rgba(60,60,67,.65)}
.fade{transition:opacity .45s ease,transform .45s ease}
.out{opacity:0;transform:translateY(14px)}
#phone{position:absolute;left:1180px;top:94px;width:414px;height:868px;border-radius:56px;background:#111214;padding:12px;box-shadow:0 30px 80px rgba(0,0,0,.25)}
#phone iframe{width:390px;height:844px;border:0;border-radius:44px;background:#F2F2F7;display:block}
#finger{position:absolute;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:rgba(20,20,30,.28);border:3px solid rgba(255,255,255,.95);box-shadow:0 6px 18px rgba(0,0,0,.25);transition:left .45s cubic-bezier(.3,.7,.3,1),top .45s cubic-bezier(.3,.7,.3,1),transform .12s,opacity .3s;opacity:0;pointer-events:none;z-index:9}
#foot{position:absolute;left:150px;bottom:34px;font-size:17px;color:rgba(60,60,67,.6)}
#end{position:absolute;inset:0;background:#F2F2F7;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;text-align:center;opacity:0;transition:opacity .7s;pointer-events:none}
#end h1{font-family:"Inter Display","Inter",sans-serif;font-size:96px;font-weight:800;letter-spacing:-.03em;line-height:1.02}
#end p{font-size:32px;color:rgba(60,60,67,.7)}
#end .crew{display:flex;gap:30px}
#end .crew div{width:150px;height:150px}
#end .crew svg{width:100%;height:100%}
#end .url{font-size:34px;font-weight:700;color:#007AFF}
</style></head><body>
<div id="left" class="fade"><span id="chap"></span><div id="title"></div><div id="sub"></div><div id="masc"></div></div>
<div id="phone"><iframe id="app" title="OpenSource Everything preview"></iframe></div>
<div id="finger"></div>
<div id="foot">Clickable preview · sample people · not live yet</div>
<div id="end"><div class="crew" id="endcrew"></div><h1>Built in the open.</h1><p>Tomorrow, OpenPrep, GoodHabit and more. One OpenID. One inbox.</p><span class="url">opensourceeverything.in</span></div>
<script>
window.setCap = (chap, title, sub, mascHtml) => {
  const L = document.getElementById('left'); L.classList.add('out');
  setTimeout(() => { document.getElementById('chap').textContent = chap; document.getElementById('title').innerHTML = title; document.getElementById('sub').textContent = sub; document.getElementById('masc').innerHTML = mascHtml || ''; L.classList.remove('out'); }, 450);
};
window.finger = (x, y, show) => { const f = document.getElementById('finger'); f.style.left = x + 'px'; f.style.top = y + 'px'; f.style.opacity = show ? 1 : 0; };
window.press = on => { document.getElementById('finger').style.transform = on ? 'scale(.8)' : 'scale(1)'; };
window.endCard = crewHtml => { document.getElementById('endcrew').innerHTML = crewHtml; document.getElementById('end').style.opacity = 1; };
</script></body></html>
