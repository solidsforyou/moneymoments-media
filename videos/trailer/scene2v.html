<!doctype html><html><head><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000;font-family:"Inter Display","Inter",sans-serif;-webkit-font-smoothing:antialiased}
#bg,#world,#ui,#fx{position:absolute;inset:0}
#world{perspective:2000px;perspective-origin:540px 960px;overflow:hidden}
.ph{position:absolute;left:0;top:0;width:390px;height:844px;transform-style:preserve-3d}
.ph .slab{position:absolute;inset:-12px;border-radius:56px;background:#1b1c20}
.ph .scr{position:absolute;inset:0;border-radius:44px;overflow:hidden;background:#fff;box-shadow:0 0 0 12px #111214}
.ph .scr img{position:absolute;inset:0;width:390px;height:844px}
.ph .sheen{position:absolute;inset:0;border-radius:44px;pointer-events:none;mix-blend-mode:screen}
.crop{position:absolute;background-repeat:no-repeat;border-radius:12px}
.panel{position:absolute;background-repeat:no-repeat;border-radius:22px}
.fing{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:rgba(255,255,255,.35);border:3px solid #fff;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.dot{position:absolute;border-radius:50%}
.mask{display:block;overflow:hidden;padding-bottom:.08em}
.mask>span{display:inline-block}
.big{font-weight:800;letter-spacing:-.05em;line-height:.96}
.lab{font:700 22px "Inter";letter-spacing:.14em;text-transform:uppercase}
.pill{position:absolute;padding:16px 26px;border-radius:999px;font:600 30px "Inter";white-space:nowrap}
.mono{font-family:ui-monospace,"DejaVu Sans Mono",Menlo,monospace}
svg{overflow:visible;width:100%;height:100%}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><filter id="hb" x="-20%" y="0" width="140%" height="100%"><feGaussianBlur id="hbv" stdDeviation="0 0"/></filter></svg>
<div id="bg"></div><div id="world"></div><div id="ui"></div><div id="fx"></div>
<script src="cap/data.js"></script><script src="cap/nifty.js"></script>
<script>
// "Welcome To Miami (Slowed)" from 36.695 s (a downbeat): 110 BPM, breakdown at beat 32, drop at beat 40.
const BEAT = 60 / 110, NB = 80.6; window.DURATION = NB * BEAT;
const $ = id => document.getElementById(id);
const IM = ['store','signup','signup2','feed','feed2','story','lesson2','question','answer','sim3','markets','hissab','chat0','chat1','mock','build0','privacy0','privacy1'];
window.READY = Promise.all(IM.map(n => new Promise(r => { const i = new Image(); i.onload = r; i.onerror = r; i.src = `cap/${n}.png`; })));
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const eout = x => 1 - Math.pow(1 - clamp(x), 3);
const eback = x => { x = clamp(x); const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const ein = x => Math.pow(clamp(x), 3);
const seg = (b, a, z) => clamp((b - a) / (z - a));
const BX = (n, k) => BOXES[n][k];
const grow = (b, d) => [b[0] - d, b[1] - d, b[2] + 2 * d, b[3] + 2 * d];
const rnd = s => { const x = Math.sin(s * 127.1) * 43758.5453; return x - Math.floor(x); };

// ---------- the crew: drawn here so their parts can move ----------
function olly(lid = 0){ const L = lid * 118; return `<svg viewBox="0 0 120 120"><text x="60" y="${26 - lid * 14}" text-anchor="middle" font-family="ui-monospace,monospace" font-size="20" font-weight="700" fill="#5B6CFF" opacity="${.4 + lid * .6}">&lt;/&gt;</text><path d="M24 52l-12-16h44l12 16z" fill="#8E9BFF" transform="rotate(${-L} 24 52)"/><path d="M96 52l12-16H64l-12 16z" fill="#7C8BFF" transform="rotate(${L} 96 52)"/><path d="M24 52h72v46a8 8 0 0 1-8 8H32a8 8 0 0 1-8-8z" fill="#5B6CFF"/><ellipse cx="47" cy="74" rx="6.5" ry="7.5" fill="#fff"/><ellipse cx="73" cy="74" rx="6.5" ry="7.5" fill="#fff"/><circle cx="48" cy="75" r="3.4" fill="#1A1A1A"/><circle cx="74" cy="75" r="3.4" fill="#1A1A1A"/><path d="M51 88q9 ${7 + lid * 3} 18 0" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round"/></svg>`; }
let gid = 0;
function sunny(rise = 1, rot = 0){ const id = 'sg' + (++gid), y = (1 - rise) * 62; return `<svg viewBox="0 0 120 120"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFC24A"/><stop offset="1" stop-color="#FF4F6D"/></linearGradient><clipPath id="${id}c"><rect x="-40" y="-60" width="200" height="154"/></clipPath></defs><g clip-path="url(#${id}c)"><g transform="translate(0 ${y})"><g transform="rotate(${rot} 60 94)" stroke="#FFB020" stroke-width="6" stroke-linecap="round" opacity="${rise}"><path d="M60 10v12M24 26l8 9M96 26l-8 9M10 60h12M98 60h12"/></g><path d="M16 94a44 44 0 0 1 88 0z" fill="url(#${id})"/><ellipse cx="47" cy="68" rx="6.5" ry="7.5" fill="#fff"/><ellipse cx="73" cy="68" rx="6.5" ry="7.5" fill="#fff"/><circle cx="48" cy="69" r="3.4" fill="#1A1A1A"/><circle cx="74" cy="69" r="3.4" fill="#1A1A1A"/><path d="M51 81q9 7 18 0" stroke="#1A1A1A" stroke-width="4" fill="none" stroke-linecap="round"/><circle cx="38" cy="80" r="4" fill="#FF8FA3" opacity=".7"/><circle cx="82" cy="80" r="4" fill="#FF8FA3" opacity=".7"/></g></g><rect x="8" y="94" width="104" height="8" rx="4" fill="#3A3D44"/></svg>`; }
function buddy(arm = 0, blink = 0, tint = '#3FA9FF'){ const ey = 8 * (1 - blink) + .6; return `<svg viewBox="0 0 120 150"><line x1="60" y1="6" x2="60" y2="20" stroke="${tint}" stroke-width="4" stroke-linecap="round"/><circle cx="60" cy="6" r="5" fill="#FFD36A"/><rect x="34" y="92" width="52" height="46" rx="18" fill="${tint}"/><circle cx="60" cy="116" r="11" fill="#fff"/><text x="60" y="121" text-anchor="middle" font-family="Inter,sans-serif" font-weight="800" font-size="14" fill="${tint}">B</text><path d="M36 102 q-14 10 -10 26" stroke="${tint}" stroke-width="9" fill="none" stroke-linecap="round"/><g transform="rotate(${arm} 84 102)"><path d="M84 102 q16 -6 20 -22" stroke="${tint}" stroke-width="9" fill="none" stroke-linecap="round"/></g><circle cx="60" cy="56" r="40" fill="${tint}"/><ellipse cx="60" cy="60" rx="31" ry="27" fill="#fff"/><ellipse cx="48" cy="54" rx="6" ry="${ey}" fill="#1A1A2E"/><ellipse cx="72" cy="54" rx="6" ry="${ey}" fill="#1A1A2E"/><path d="M47 63 q13 12 26 0" stroke="#1A1A2E" stroke-width="4" fill="none" stroke-linecap="round"/></svg>`; }
function goodguy(){ return `<svg viewBox="0 0 120 120"><path d="M48 96l-6 14M72 96l6 14" stroke="#B7791F" stroke-width="6" stroke-linecap="round"/><path d="M34 112h14M72 112h14" stroke="#7A5210" stroke-width="7" stroke-linecap="round"/><path d="M22 58q-14 4-12 18M98 58q14-6 12-20" stroke="#B7791F" stroke-width="6" fill="none" stroke-linecap="round"/><circle cx="60" cy="56" r="42" fill="#E8A317"/><circle cx="60" cy="56" r="34" fill="#FFCF4D"/><ellipse cx="47" cy="58" rx="6" ry="7" fill="#fff"/><ellipse cx="73" cy="58" rx="6" ry="7" fill="#fff"/><circle cx="48" cy="59" r="3.3" fill="#1A1A1A"/><circle cx="74" cy="59" r="3.3" fill="#1A1A1A"/><path d="M50 72q10 8 20 0" stroke="#1A1A1A" stroke-width="4" fill="none" stroke-linecap="round"/></svg>`; }
const coinBack = `<svg viewBox="0 0 120 120"><circle cx="60" cy="56" r="42" fill="#E8A317"/><circle cx="60" cy="56" r="34" fill="#FFCF4D"/><text x="60" y="72" text-anchor="middle" font-family="Inter,sans-serif" font-weight="800" font-size="44" fill="#B7791F">₹</text></svg>`;
function coin(angle){ const c = Math.cos(angle * Math.PI / 180); return `<div style="width:100%;height:100%;transform:scaleX(${Math.max(.04, Math.abs(c))})">${c >= 0 ? goodguy() : coinBack}</div>`; }

// ---------- building blocks ----------
const crop = (img, b, st = '') => `<div class="crop" style="left:${b[0]}px;top:${b[1]}px;width:${b[2]}px;height:${b[3]}px;background-image:url(cap/${img}.png);background-size:390px 844px;background-position:${-b[0]}px ${-b[1]}px;${st}"></div>`;
// a crop shown as a big floating panel in screen space (scale k)
const panel = (img, b, x, y, k, tr = '', st = '') => `<div class="panel" style="left:${x - b[2] * k / 2}px;top:${y - b[3] * k / 2}px;width:${b[2] * k}px;height:${b[3] * k}px;background-image:url(cap/${img}.png);background-size:${390 * k}px ${844 * k}px;background-position:${-b[0] * k}px ${-b[1] * k}px;transform:${tr};${st}"></div>`;
// the 3D phone. o: {x,y,s,rx,ry,rz,z,img,blur,dim,kids,sheen}
function phone(o){
  const { x = 960, y = 540, s = 1, rx = 0, ry = 0, rz = 0, z = 0, img, blur = 0, dim = 0, kids = '', sheen = 0 } = o;
  const sh = `linear-gradient(${115 + ry * .6}deg, transparent ${30 + sheen * 40}%, rgba(255,255,255,.22) ${38 + sheen * 40}%, transparent ${48 + sheen * 40}%)`;
  return `<div class="ph" style="transform:translate3d(${x - 195}px,${y - 422}px,${z}px) rotateX(${rx}deg) rotateY(${ry}deg) rotateZ(${rz}deg) scale(${s})">
    <div class="slab" style="transform:translateZ(-14px)"></div><div class="slab" style="transform:translateZ(-7px);background:#2a2c31"></div>
    <div class="scr"><img src="cap/${img}.png" style="filter:blur(${blur}px) brightness(${1 - dim})"></div>
    <div class="sheen" style="background:${sh};transform:translateZ(1px)"></div>${kids}</div>`;
}
// lift a piece of the screen toward the camera (a child of the phone, so it starts exactly in place)
const lift = (img, b, z, k = 1, st = '') => crop(img, b, `transform:translateZ(${z}px) scale(${k});box-shadow:0 ${z / 7}px ${z / 2.5}px rgba(0,0,0,${clamp(z / 900, 0, .38)});${st}`);
const finger = (x, y, z, press) => `<div class="fing" style="left:${x}px;top:${y}px;transform:translateZ(${z}px) scale(${press ? .78 : 1})"></div>`;
function burst(x, y, z, d, col, n = 18, spread = 120){ let h = ''; for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2 + rnd(i) * .4, r = eout(d) * spread * (.6 + rnd(i + 9) * .6), sz = 6 + rnd(i + 3) * 8; h += `<div class="dot" style="left:${x + Math.cos(a) * r - sz / 2}px;top:${y + Math.sin(a) * r - sz / 2}px;width:${sz}px;height:${sz}px;background:${col};opacity:${1 - d};transform:translateZ(${z}px)"></div>`; } return h; }
// masked text that slides up into view at beat a
const reveal = (b, a, html, st = '', dur = .45) => { const k = eout((b - a) / dur); return b < a ? '' : `<span class="mask" style="${st}"><span style="transform:translateY(${(1 - k) * 105}%)">${html}</span></span>`; };
const abs = (x, y, html, st = '') => `<div style="position:absolute;left:${x}px;top:${y}px;${st}">${html}</div>`;
const sweep = (b, a, dur = 1) => { const k = seg(b, a, a + dur); return k <= 0 || k >= 1 ? '' : `<div style="position:absolute;inset:0;background:linear-gradient(105deg,transparent ${k * 140 - 30}%,rgba(255,255,255,.35) ${k * 140 - 15}%,transparent ${k * 140}%);mix-blend-mode:overlay"></div>`; };

// ---------- the Nifty, Jan to Apr 2020 (real closes) ----------
const NF = window.NIFTY, N0 = NF[0][1], iOf = d => NF.findIndex(x => x[0] === d);
const I11 = iOf('2020-03-11'), I12 = iOf('2020-03-12'), ILOW = NF.reduce((m, x, i) => x[1] < NF[m][1] ? i : m, 0), IEND = NF.length - 1;
const CH = { x0: 80, x1: 1000, y0: 760, y1: 1380, lo: 7000, hi: 12800 };
const cx = i => CH.x0 + (CH.x1 - CH.x0) * i / IEND, cy = v => CH.y1 - (CH.y1 - CH.y0) * (v - CH.lo) / (CH.hi - CH.lo);
const inr = v => '₹' + Math.round(v).toLocaleString('en-IN');
const fdate = d => new Date(d + 'T00:00:00Z').toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC' });
function chart(upto, b, red){
  const n = Math.floor(upto), f = upto - n, pts = NF.slice(0, n + 1).map((p, i) => [cx(i), cy(p[1])]);
  if (n < IEND && f > 0) pts.push([lerp(cx(n), cx(n + 1), f), lerp(cy(NF[n][1]), cy(NF[n + 1][1]), f)]);
  const path = (from, to, col, w) => { const P = pts.slice(from, to + 1); if (P.length < 2) return ''; return `<path d="M${P.map(p => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join('L')}" stroke="${col}" stroke-width="${w}" fill="none" stroke-linejoin="round" stroke-linecap="round" style="filter:drop-shadow(0 0 14px ${col})"/>`; };
  const cut = red ? Math.min(I11, pts.length - 1) : pts.length - 1;
  const lowEnd = Math.min(pts.length - 1, ILOW);
  let s = `<svg width="1080" height="1920" style="position:absolute;left:0;top:0">`;
  for (let k = 0; k <= 4; k++) { const v = CH.lo + (CH.hi - CH.lo) * k / 4; s += `<line x1="${CH.x0}" x2="${CH.x1}" y1="${cy(v)}" y2="${cy(v)}" stroke="rgba(255,255,255,.07)"/>`; }
  s += `<line x1="${CH.x0}" x2="${CH.x1}" y1="${cy(N0)}" y2="${cy(N0)}" stroke="rgba(255,255,255,.25)" stroke-dasharray="6 10"/>`;
  s += path(0, cut, '#7CF0A0', 6);
  if (red) { s += path(cut, lowEnd, '#FF453A', 7); if (pts.length - 1 > ILOW) s += path(ILOW, pts.length - 1, '#7CF0A0', 6); }
  const L = pts[pts.length - 1]; s += `<circle cx="${L[0]}" cy="${L[1]}" r="11" fill="${red && pts.length - 1 <= ILOW && pts.length - 1 > I11 ? '#FF453A' : '#7CF0A0'}"/><circle cx="${L[0]}" cy="${L[1]}" r="${22 + Math.sin(b * Math.PI * 2) * 4}" fill="none" stroke="rgba(255,255,255,.4)" stroke-width="2"/>`;
  return s + '</svg>';
}
const valAt = u => { const n = Math.min(IEND, Math.floor(u)), f = u - n; return n < IEND ? lerp(NF[n][1], NF[n + 1][1], f) : NF[IEND][1]; };

// ---------- sound cues (beat, kind), read by sfx.py ----------
window.SFX = [[0,'tick'],[1,'tick'],[2,'tick'],[3,'tick'],[4,'pop'],[4.5,'whoosh'],[5,'pop'],[5.5,'pop'],[6,'pop'],[6.5,'pop'],[7.4,'whoosh'],[8,'whoosh'],[9.4,'rise'],[10,'click'],[10.8,'whoosh'],[12,'whoosh'],[13.2,'pop'],[13.5,'pop'],[13.8,'pop'],[14,'whoosh'],[15.2,'rise'],[16,'click'],[16,'pop'],[18,'whoosh'],[20,'whoosh'],[22,'whoosh'],[25,'whoosh'],[27,'click'],[28,'pop'],[30,'whoosh'],[32,'riser'],[40,'impact'],[42,'whoosh'],[44,'whoosh'],[46,'whoosh'],[48,'whoosh'],[48.5,'tick'],[49,'tick'],[49.5,'tick'],[50,'whoosh'],[50.5,'pop'],[51,'pop'],[51.5,'pop'],[52,'whoosh'],[53,'whoosh'],[54,'pop'],[56.5,'click'],[57,'whoosh'],[58,'whoosh'],[60,'whoosh'],[62.5,'tick'],[66,'whoosh'],[67.6,'click'],[68.4,'click'],[70,'whoosh'],[72,'pop'],[72.5,'pop'],[73,'pop'],[73.5,'pop'],[74,'whoosh'],[76.5,'tick']];

// ---------- the film ----------
function renderFrame(t){
  const b = t / BEAT; let bg = '#000', W = '', U = '', FX = '', whip = 0, shake = 0;
  // 0-8 · intro: words, then Olly opens and the apps fly out
  if (b < 8) {
    bg = 'radial-gradient(70% 70% at 50% 45%,#2a1f6b 0%,#0d0a26 60%,#05040d 100%)';
    if (b < 4) { const w = ['Free.', 'Open.', 'Ad-free.', 'Yours.'][Math.floor(b)]; U += abs(0, 760, reveal(b, Math.floor(b), w, 'text-align:center;width:1080px', .3), 'width:1080px;color:#fff;font-size:200px;font-weight:800;letter-spacing:-.05em;line-height:1'); U += `<div style="position:absolute;left:0;right:0;top:1020px;text-align:center;color:rgba(255,255,255,.5)" class="lab">OpenSource Everything</div>`; }
    else {
      const k = eback(seg(b, 4, 4.6)), lid = ease(seg(b, 4.5, 5.2)), dive = ein(seg(b, 7.3, 8)), size = 380 * k * (1 + dive * 7);
      U += `<div style="position:absolute;left:${540 - size / 2}px;top:${1250 - size / 2 + dive * 200}px;width:${size}px;height:${size}px;opacity:${1 - seg(b, 7.8, 8)}">${olly(lid)}</div>`;
      const apps = [['Tomorrow', 'linear-gradient(135deg,#FFE1B0,#FFC2CC)', sunny(1, 0)], ['OpenPrep', 'linear-gradient(135deg,#1B4DFF,#06115A)', buddy(0, 0)], ['GoodHabit', 'linear-gradient(135deg,#1E3A2B,#0B7A3B)', goodguy()], ['The Good Stuff', 'linear-gradient(135deg,#FFC93C,#FF8A3D)', '<svg viewBox="0 0 24 24"><path d="M12 3l2 6 6 2-6 2-2 6-2-6-6-2 6-2z" fill="#fff"/></svg>']];
      apps.forEach(([n, g, art], i) => { const d = seg(b, 5 + i * .5, 5.9 + i * .5); if (d <= 0) return; const e = eout(d), tx = lerp(540, 300 + (i % 2) * 480, e), ty = lerp(1150, 380 + Math.floor(i / 2) * 380, e) - Math.sin(d * Math.PI) * 160, sc = lerp(.2, 1, e) * (1 + dive * 4), rot = (1 - e) * (i % 2 ? 260 : -260);
        U += `<div style="position:absolute;left:${tx - 110 * sc}px;top:${ty - 110 * sc}px;width:${220 * sc}px;text-align:center;transform:rotateY(${rot}deg);opacity:${1 - dive}"><div style="width:${220 * sc}px;height:${220 * sc}px;border-radius:${56 * sc}px;background:${g};display:grid;place-items:center;box-shadow:0 30px 80px rgba(0,0,0,.5)"><div style="width:62%;height:62%">${art}</div></div><div style="color:#fff;font-weight:700;font-size:${34 * sc}px;margin-top:${12 * sc}px">${n}</div></div>`; });
      U += abs(0, 1560, reveal(b, 6.6, 'One home for all of it.', 'text-align:center;width:1080px'), 'width:1080px;color:#fff;font-size:64px;font-weight:800;letter-spacing:-.03em');
      FX += sweep(b, 6.8, 1.2);
    }
  }
  // 8-14 · one OpenID, with Telegram
  else if (b < 14) {
    bg = 'radial-gradient(90% 90% at 70% 40%,#FFFFFF 0%,#E7ECF7 70%,#D9E0F0 100%)';
    if (b < 12) {
      const fly = eout(seg(b, 8, 9)), ry = lerp(-34, -14, ease(seg(b, 8, 9.6))) + seg(b, 10.8, 12) * 8, l1 = ease(seg(b, 9.3, 9.9)) * (1 - ease(seg(b, 10.3, 10.8))), l2 = ease(seg(b, 10.8, 11.4));
      const img = b < 10.2 ? 'signup' : 'signup2', tg = BX('signup', 'tg'), nm = [18, 486, 354, 132];
      let kids = lift('signup', tg, 260 * l1, 1 + .18 * l1 - (Math.abs(b - 10) < .12 ? .06 : 0), 'border-radius:26px') ;
      if (b > 9.2 && b < 10.6) kids += finger(tg[0] + tg[2] * .62, tg[1] + tg[3] / 2, 270 * l1 + 10, Math.abs(b - 10) < .12);
      if (b >= 10 && b < 10.9) kids += burst(tg[0] + tg[2] * .62, tg[1] + tg[3] / 2, 280 * l1, seg(b, 10, 10.9), '#2AABEE', 14, 140);
      if (l2 > 0) kids += lift('signup2', nm, 320 * l2, 1 + .12 * l2, 'border-radius:16px;background-color:#fff');
      W += phone({ x: 540, y: 1260, s: 1.3, rx: 6, ry, z: lerp(-900, 0, fly), img, blur: 5 * Math.max(l1, l2), dim: .12 * Math.max(l1, l2), kids, sheen: seg(b, 8, 12) });
      U += abs(90, 180, reveal(b, 8.2, '<span class="lab" style="color:#007AFF">One OpenID</span>'), '') + abs(90, 220, reveal(b, 8.4, 'Sign up once.') + reveal(b, 8.7, 'Use every app.'), 'font-size:96px;font-weight:800;letter-spacing:-.045em;line-height:1.02;color:#0B0B0F');
      U += abs(90, 450, reveal(b, 10.4, 'Log in with Telegram. We get your name and photo,<br>never your number or chats.'), 'font:500 28px Inter;color:#55575E;line-height:1.4');
    } else {
      const wipe = eout(seg(b, 12, 12.4));
      bg = `linear-gradient(180deg,#007AFF ${wipe * 100}%,#E7ECF7 ${wipe * 100}%)`;
      U += abs(0, 640, reveal(b, 12.15, 'One OpenID.') + reveal(b, 13, 'Every app.'), 'width:1080px;text-align:center;color:#fff;font-size:120px;font-weight:800;letter-spacing:-.05em;line-height:1');
      [['PrepID', 13.2], ['GoodID', 13.5], ['Tomorrow ID', 13.8]].forEach(([n, a], i) => { const k = eback(seg(b, a, a + .4)); if (k > 0) U += `<div class="pill" style="left:${110 + i * 280 - (n.length > 7 ? 20 : 0)}px;top:${1020 - (1 - k) * 60}px;background:#fff;color:#007AFF;opacity:${clamp(k)};transform:scale(${k})">${n}</div>`; });
    }
  }
  // 14-22 · Tomorrow
  else if (b < 22) {
    const rise = eout(seg(b, 14, 15.6));
    bg = `radial-gradient(80% 70% at 50% ${100 - rise * 20}%,#FFD8A8 0%,#FF9A8B 55%,#6B2E5A 100%)`;
    if (b < 20) {
