<!doctype html>
<html><head><meta charset="utf-8"><title>SFY roll to wear: type layer</title>
<style>
/* Clean transparent type layer. One short line at a time in the lower third; every word appears on a sung word
   of the track (Whisper word times, reel time = song time - 1.73). Driven only by renderFrame(t). */
@font-face{font-family:IT;src:url(fonts/InterTight-800-normal.woff2);font-weight:800}
@font-face{font-family:DMS;src:url(fonts/DMSerifDisplay-400-italic.woff2);font-style:italic}
@font-face{font-family:MS;src:url(fonts/Montserrat-500-normal.woff2);font-weight:500}
:root{--cream:#F6F2EA}
html,body{margin:0;width:1080px;height:1920px;background:transparent;overflow:hidden}
.line{position:absolute;left:60px;right:60px;top:1210px;text-align:center;white-space:nowrap;color:var(--cream);
  text-shadow:0 8px 36px rgba(0,0,0,.5),0 2px 8px rgba(0,0,0,.3)}
.w{display:inline-block;margin:0 .13em;opacity:0;will-change:transform,filter,opacity}
.s{font:800 118px/1 IT,Inter;letter-spacing:-.045em}
.i{font:italic 400 136px/1 DMS,Inter;letter-spacing:-.01em}
#grad{position:absolute;left:0;right:0;bottom:0;height:900px;background:linear-gradient(to top,rgba(0,0,0,.42),rgba(0,0,0,0));opacity:0}
#shade{position:absolute;inset:0;background:rgba(8,8,10,.55);opacity:0}
#logo{position:absolute;top:800px;left:50%;width:700px;transform:translateX(-50%);opacity:0}
#soon{top:1130px}
#soon .w{font:500 34px MS;letter-spacing:.32em;margin:0 .22em}
</style></head><body>
<div id="grad"></div><div id="shade"></div>
<img id="logo" src="sfy-logo-white.png">
<div id="lines"></div>
<div id="soon" class="line"></div>
<script>
const DURATION=28.48; window.DURATION=DURATION; const END=24.79;
// [ [word, appears at, style s=sans i=serif italic], ... ], line leaves at `out`
const LINES=[
 {out:1.18, w:[['this',0.05,'s'],['tee',0.71,'s']]},
 {out:2.60, w:[['started',1.20,'s'],['here.',1.85,'i']]},
 {out:10.00,w:[['our',8.25,'s'],['name,',8.81,'i']]},
 {out:10.00,top:1350,w:[['on',9.49,'s'],['every',9.62,'s'],['piece.',9.77,'i']]},
 {out:11.60,w:[['320',10.07,'s'],['gsm',10.55,'i']]},
 {out:13.69,w:[['230',11.87,'s'],['gsm',13.01,'i']]},
 {out:18.08,w:[['joggers',15.73,'s'],['₹1,499',16.41,'i']]},
 {out:21.08,w:[['tees',19.73,'s'],['₹999',20.41,'i']]},
];
const SOON=[['COMING',25.27],['SOON',25.95],['ON',26.27],['AMAZON',26.77]];
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)), p=(t,a,d)=>clamp((t-a)/d);
const out3=x=>1-Math.pow(1-x,3), in2=x=>x*x;
const root=document.getElementById('lines');
const built=LINES.map(L=>{const d=document.createElement('div');d.className='line';if(L.top)d.style.top=L.top+'px';
  L.els=L.w.map(([txt,,st])=>{const s=document.createElement('span');s.className='w '+st;s.textContent=txt;d.appendChild(s);return s});
  root.appendChild(d);return L});
const soon=document.getElementById('soon');
const soonEls=SOON.map(([txt])=>{const s=document.createElement('span');s.className='w';s.textContent=txt;soon.appendChild(s);return s});
function word(el,t,a,out){ // blur-pop in on its sung word, blur out with the line
  if(t<a||t>out){el.style.opacity=0;return}
  const i=out3(p(t,a,.2)), o=1-in2(p(t,out-.12,.12));
  el.style.opacity=Math.min(i,o);
  el.style.transform=`translateY(${(1-i)*18}px) scale(${1.18-.18*i})`;
  el.style.filter=`blur(${(1-i)*18+(1-o)*12}px)`}
function renderFrame(t){
  built.forEach(L=>L.els.forEach((el,k)=>word(el,t,L.w[k][1],L.out)));
  const g=Math.max(0,...LINES.map(L=>Math.min(p(t,L.w[0][1]-.15,.3),1-p(t,L.out-.1,.3))));
  document.getElementById('grad').style.opacity=g;
  const sh=out3(p(t,END,.5)); document.getElementById('shade').style.opacity=sh;
  const lg=document.getElementById('logo'), k=out3(p(t,END+.02,.32));
  lg.style.opacity=t>=END?k:0; lg.style.filter=`blur(${(1-k)*22}px)`; lg.style.transform=`translateX(-50%) scale(${1.15-.15*k})`;
  soonEls.forEach((el,i)=>word(el,t,SOON[i][1],DURATION+1));
}
window.renderFrame=renderFrame;
if(!navigator.webdriver){const t0=performance.now();(function loop(){renderFrame(((performance.now()-t0)/1000)%DURATION);requestAnimationFrame(loop)})()}
</script></body></html>
