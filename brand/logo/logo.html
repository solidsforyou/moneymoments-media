<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: #07070a;
    --amber: #ffb02e;
    --amber-deep: #ff7a00;
    --white: #f5f5f7;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--bg); font-family: "Inter Display", "Inter", sans-serif; }
  .art { position: relative; overflow: hidden; background: var(--bg); display: none; }
  body[data-v="icon"] #icon,
  body[data-v="wordmark"] #wordmark,
  body[data-v="stacked"] #stacked { display: block; }

  /* Shared glow layers */
  .glow {
    position: absolute; border-radius: 50%; filter: blur(60px);
    background: radial-gradient(circle, rgba(255,140,0,.55) 0%, rgba(255,122,0,.18) 40%, transparent 70%);
  }
  .grain {
    position: absolute; inset: 0; opacity: .07; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='200' height='200' filter='url(%23n)'/></svg>");
  }

  /* Icon: 1080x1080, safe inside Instagram's circle crop */
  #icon { width: 1080px; height: 1080px; }
  #icon .glow { width: 900px; height: 900px; left: 90px; top: 90px; }
  #icon .ring {
    position: absolute; left: 50%; top: 50%; border-radius: 50%;
    transform: translate(-50%, -50%);
    border: 3px solid rgba(255,176,46,.85);
    box-shadow: 0 0 24px rgba(255,150,30,.8), inset 0 0 24px rgba(255,150,30,.5);
  }
  #icon .r1 { width: 820px; height: 820px; border-color: rgba(255,176,46,.35); box-shadow: 0 0 18px rgba(255,150,30,.35); }
  #icon .r2 { width: 640px; height: 640px; }
  #icon .mark {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 400px; letter-spacing: -10px; line-height: 1;
  }
  #icon .rupee {
    color: var(--white);
    text-shadow: 0 0 30px rgba(255,255,255,.35), 0 0 80px rgba(255,150,30,.45);
  }
  #icon .q {
    color: var(--amber);
    text-shadow: 0 0 28px rgba(255,150,30,.95), 0 0 80px rgba(255,122,0,.7);
    margin-left: 6px;
  }

  /* Wordmark: 2400x800, for end cards and banners */
  #wordmark { width: 2400px; height: 800px; }
  #wordmark .glow { width: 1800px; height: 900px; left: 300px; top: 150px; border-radius: 50%; }
  #wordmark .horizon {
    position: absolute; left: -10%; right: -10%; top: 620px; height: 900px; border-radius: 50%;
    border-top: 4px solid rgba(255,200,120,.9);
    box-shadow: 0 -20px 80px rgba(255,140,0,.55);
    background: radial-gradient(ellipse at top, rgba(255,140,0,.25), transparent 60%);
  }
  .words {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    gap: 34px; font-weight: 700; letter-spacing: -4px; color: var(--white);
  }
  #wordmark .words { font-size: 190px; padding-bottom: 80px; }
  .hl {
    position: relative; color: var(--white); padding: 0 30px 12px;
    background: linear-gradient(180deg, rgba(255,176,46,.30), rgba(255,122,0,.18));
    border: 4px solid var(--amber);
    box-shadow: 0 0 40px rgba(255,140,0,.45), inset 0 0 30px rgba(255,140,0,.25);
    text-shadow: 0 0 30px rgba(255,150,30,.6);
  }
  .hl::before, .hl::after {
    content: ""; position: absolute; width: 22px; height: 22px; border-radius: 50%;
    background: var(--white); box-shadow: 0 0 14px rgba(255,255,255,.8);
  }
  .hl::before { left: -11px; top: -11px; }
  .hl::after { right: -11px; bottom: -11px; }
  .qmark { color: var(--amber); text-shadow: 0 0 30px rgba(255,150,30,.9); margin-left: -20px; }

  /* Stacked: 1080x1350 (4:5), for posts and the first frame of reels */
  #stacked { width: 1080px; height: 1350px; }
  #stacked .glow { width: 1000px; height: 1000px; left: 40px; top: 120px; }
  #stacked .stack {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 30px;
    font-weight: 700; color: var(--white); letter-spacing: -4px;
  }
  #stacked .line { font-size: 170px; line-height: 1; }
  #stacked .hl { font-size: 170px; line-height: 1.05; }
  #stacked .tag {
    margin-top: 50px; font-size: 40px; letter-spacing: 1px; font-weight: 500;
    color: rgba(245,245,247,.7);
  }
</style>
</head>
<body>
  <div class="art" id="icon">
    <div class="glow"></div>
    <div class="ring r1"></div>
    <div class="ring r2"></div>
    <div class="mark"><span class="rupee">₹</span><span class="q">?</span></div>
    <div class="grain"></div>
  </div>

  <div class="art" id="wordmark">
    <div class="glow"></div>
    <div class="horizon"></div>
    <div class="words"><span>Paisa</span><span class="hl">kahan</span><span>se</span><span class="qmark">?</span></div>
    <div class="grain"></div>
  </div>

  <div class="art" id="stacked">
    <div class="glow"></div>
    <div class="stack">
      <div class="line">Paisa</div>
      <div class="hl">kahan</div>
      <div class="line">se<span class="qmark" style="margin-left:4px">?</span></div>
      <div class="tag">Indian startups ka asli hisaab</div>
    </div>
    <div class="grain"></div>
  </div>
  <script>
    document.body.dataset.v = new URLSearchParams(location.search).get("v") || "icon";
  </script>
</body>
</html>
